<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7BC93F">
<title>AROS Qarzdorlar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
--bg:#060610;--bg2:#0e0e20;--bg3:#161628;--border:#1e1e38;
--text:#f0f0ff;--text2:#9393b8;--text3:#5e5e83;
--green:#00e5a0;--red:#ff4d6d;--amber:#ffb800;--blue:#378ADD;--violet:#a855f7;
--r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
--tint-green:rgba(0,229,160,.13);  --tint-green-b:rgba(0,229,160,.28);
--tint-amber:rgba(255,184,0,.13);  --tint-amber-b:rgba(255,184,0,.30);
--tint-red:rgba(255,77,109,.13);   --tint-red-b:rgba(255,77,109,.30);
--tint-blue:rgba(55,138,221,.14);  --tint-blue-b:rgba(55,138,221,.32);
--tint-violet:rgba(168,85,247,.15);--tint-violet-b:rgba(168,85,247,.32);
--tint-neutral:rgba(148,148,190,.13);--tint-neutral-b:rgba(148,148,190,.26);
}
[data-theme="light"]{
--bg:#f4f4fa;--bg2:#ffffff;--bg3:#f1f1f7;--border:#e2e2ee;
--text:#0a0a1a;--text2:#54546e;--text3:#84849c;
--green:#00875a;--red:#d92646;--amber:#a06400;--blue:#185FA5;--violet:#7C3AED;
--tint-green:rgba(0,135,90,.10);   --tint-green-b:rgba(0,135,90,.24);
--tint-amber:rgba(160,100,0,.11);  --tint-amber-b:rgba(160,100,0,.26);
--tint-red:rgba(217,38,70,.09);    --tint-red-b:rgba(217,38,70,.24);
--tint-blue:rgba(24,95,165,.10);   --tint-blue-b:rgba(24,95,165,.26);
--tint-violet:rgba(124,58,237,.10);--tint-violet-b:rgba(124,58,237,.26);
--tint-neutral:rgba(30,30,60,.06); --tint-neutral-b:rgba(30,30,60,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
input,select,button{font-family:inherit}
.lu{display:inline-block;vertical-align:middle;flex-shrink:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--r-xs)}

.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--green);letter-spacing:2px;flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-size:14px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text2);transition:transform .12s ease}
.ibtn:active{transform:scale(.92)}
.ibtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Jami karta */
.sum{margin:12px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sum-l{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.sum-v{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-s{font-size:10px;color:var(--text2);margin-top:2px}
.prog{margin:8px 14px 0;height:4px;background:var(--bg3);border-radius:var(--r-full);overflow:hidden;display:none}
.prog>div{height:100%;width:0;background:var(--green);transition:width .3s ease}

/* Filtrlar */
.filters{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{width:100%;min-height:42px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 36px 10px 38px;color:var(--text);font-size:14px;outline:none;font-weight:600}
.search input::placeholder{color:var(--text3);font-weight:500}
.search .lu{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;background:var(--bg3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow.three{grid-template-columns:1fr 1fr 1fr}
.fld{position:relative;min-width:0}
.fld label{position:absolute;left:10px;top:4px;font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;pointer-events:none}
.fld select,.fld input{width:100%;min-height:44px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 28px 4px 10px;color:var(--text);font-size:13px;font-weight:700;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer}
.fld input{padding-right:10px}
.fld::after{content:'';position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--text3);border-bottom:1.5px solid var(--text3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fld.noarrow::after{display:none}
.fld.on select,.fld.on input{border-color:var(--tint-green-b);background:linear-gradient(0deg,var(--tint-green),var(--tint-green)),var(--bg2)}
/* Multiselect (qidiruvli) — tugma + pastdan chiqadigan varaq */
.msel-btn{width:100%;min-height:44px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 28px 4px 10px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.fld.on .msel-btn{border-color:var(--tint-green-b);background:linear-gradient(0deg,var(--tint-green),var(--tint-green)),var(--bg2)}
.ms-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none}
.ms-back.open{display:block}
.ms-sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--bg2);border-top:1px solid var(--border);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:201;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.ms-sheet.open{display:flex}
.ms-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ms-head b{flex:1;font-size:14px}
.ms-head .ms-cnt{font-size:11px;color:var(--text2);font-weight:700}
.ms-search{padding:0 14px 8px}
.ms-search input{width:100%;min-height:40px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-weight:600}
.ms-list{flex:1;overflow-y:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
.ms-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:var(--r-sm);cursor:pointer;min-height:44px}
.ms-item:active{background:var(--bg3)}
.ms-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.ms-item.on .ms-box{background:var(--green);border-color:var(--green)}
.ms-item.on .ms-box::after{content:'';width:5px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg) translate(-1px,-1px)}
[data-theme="light"] .ms-item.on .ms-box::after{border-color:#fff}
.ms-t{flex:1;min-width:0}
.ms-t div{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-t span{font-size:11px;color:var(--text3);font-weight:600}
.ms-n{font-size:11px;color:var(--text2);font-weight:700;flex-shrink:0}
.ms-foot{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--border)}
.ms-foot div{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-md);font-size:13px;font-weight:800;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.ms-foot .ok{background:var(--green);border-color:var(--green);color:#041a10}
@media(min-width:700px){.ms-sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;max-height:70vh;border-radius:var(--r-lg);border:1px solid var(--border)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:30px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.chip b{font-weight:800;color:var(--text3)}
.chip.on{background:var(--tint-red);border-color:var(--tint-red-b);color:var(--red)}
.chip.on b{color:var(--red)}
.chip.on.amb{background:var(--tint-amber);border-color:var(--tint-amber-b);color:var(--amber)}
.chip.on.amb b{color:var(--amber)}
.chip.on.blu{background:var(--tint-blue);border-color:var(--tint-blue-b);color:var(--blue)}
.chip.on.blu b{color:var(--blue)}
.chip.on.neu{background:var(--tint-neutral);border-color:var(--tint-neutral-b);color:var(--text)}
.chip.on.neu b{color:var(--text)}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px}
.sortbar .cnt{font-size:12px;color:var(--text2);font-weight:700}
.sortbar .cnt b{color:var(--text)}
.reset{font-size:12px;font-weight:700;color:var(--red);cursor:pointer;display:none}

/* Ro'yxat */
.list{padding:6px 14px 40px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;cursor:pointer}
.row:active{transform:scale(.995)}
.row-top{display:flex;align-items:flex-start;gap:10px}
.av{width:38px;height:38px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.r-name{font-size:14px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:800;white-space:nowrap;line-height:1}
.tag.id{background:var(--bg3);color:var(--text2)}
.tag.fil{background:var(--tint-neutral);border:1px solid var(--tint-neutral-b);color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:17px}
.tag.red{background:var(--tint-red);color:var(--red)}
.tag.amb{background:var(--tint-amber);color:var(--amber)}
.tag.grn{background:var(--tint-green);color:var(--green)}
.tag.blu{background:var(--tint-blue);color:var(--blue)}
.r-tel{font-size:11px;color:var(--text2);font-weight:600;white-space:nowrap}
.r-right{text-align:right;flex-shrink:0;margin-left:4px}
.r-sum{font-size:14px;font-weight:800;color:var(--red);white-space:nowrap}
.r-sub{font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap}
.r-det{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.row.open .r-det{display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.kv div{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.kv span{color:var(--text3)}
.kv b{font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px}
.acts a,.acts div{flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.acts .pri{background:var(--tint-green);border-color:var(--tint-green-b);color:var(--green)}
.tag.til{background:var(--tint-violet);border:1px solid var(--tint-violet-b);color:var(--violet);gap:3px;cursor:pointer}
.rec-wrap{margin-top:10px}
.mdl-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:700;align-items:center;justify-content:center;padding:20px}
.empty{text-align:center;padding:50px 24px;color:var(--text2);font-size:13px}
.loading{text-align:center;padding:50px 24px;color:var(--text2);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 12px}
.err-box{margin:14px;padding:14px;background:var(--tint-red);border:1px solid var(--tint-red-b);border-radius:var(--r-md);color:var(--red);font-size:13px;font-weight:600}
.note{margin:6px 14px 0;font-size:11px;color:var(--amber);font-weight:600}
@media(min-width:700px){.list{display:grid;grid-template-columns:1fr 1fr}.sum{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="hdr">
  <div class="ibtn" onclick="goBack()" title="CEO sahifasi"><svg class="lu" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></div>
  <div class="hdr-info">
    <div class="hdr-title">Qarzdorlar · barcha filiallar</div>
    <div class="hdr-sub" id="hdr-sub">Yuklanmoqda...</div>
  </div>
  <div class="ibtn" id="refreshBtn" onclick="load(true)" title="Yangilash"><svg class="lu" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></div>
  <div class="ibtn" id="themeBtn" onclick="toggleTheme()" title="Tema"><svg class="lu" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></div>
</div>

<div class="sum" id="sum">
  <div><div class="sum-l">Qarzdorlar</div><div class="sum-v num" id="s-cnt">—</div><div class="sum-s" id="s-cnt-s">filtr bo'yicha</div></div>
  <div><div class="sum-l">Muddati o'tgan</div><div class="sum-v num" id="s-otgan" style="color:var(--red)">—</div><div class="sum-s">so'm (hamyon ayirilgan)</div></div>
  <div><div class="sum-l">Jami qarz</div><div class="sum-v num" id="s-jami">—</div><div class="sum-s">so'm</div></div>
</div>
<div class="prog" id="prog"><div id="prog-bar"></div></div>
<div class="note" id="note" style="display:none"></div>

<div class="filters">
  <div class="search">
    <svg class="lu" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Ism, telefon yoki ID bo'yicha qidirish" autocomplete="off" oninput="onFilter()">
    <div class="clr" id="q-clr" onclick="clearQ()"><svg class="lu" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  </div>
  <div class="chips" id="status-chips"></div>
  <div class="frow">
    <div class="fld" id="f-fil-w"><label>Filial</label><div class="msel-btn" id="f-fil-btn" onclick="msOpen('fil')">Hammasi</div></div>
    <div class="fld" id="f-cli-w"><label>Mijoz</label><div class="msel-btn" id="f-cli-btn" onclick="msOpen('cli')">Hammasi</div></div>
  </div>
  <div class="frow three">
    <div class="fld" id="f-prof-w"><label>Profil</label><select id="f-prof" onchange="onFilter()"><option value="">Hammasi</option><option>Zapchast</option><option>Aksessuar</option><option>Franshiza</option></select></div>
    <div class="fld" id="f-kun-w"><label>Kun</label><select id="f-kun" onchange="onFilter()">
      <option value="">Hammasi</option><option value="1-7">1–7 kun</option><option value="8-15">8–15 kun</option><option value="16-30">16–30 kun</option><option value="31-60">31–60 kun</option><option value="61-">60+ kun</option>
    </select></div>
    <div class="fld" id="f-sum-w"><label>Summa</label><select id="f-sum" onchange="onFilter()">
      <option value="">Hammasi</option><option value="100000">≥ 100 ming</option><option value="500000">≥ 500 ming</option><option value="1000000">≥ 1 mln</option><option value="5000000">≥ 5 mln</option><option value="10000000">≥ 10 mln</option><option value="50000000">≥ 50 mln</option>
    </select></div>
  </div>
  <div class="frow three">
    <div class="fld" id="f-tur-w"><label>Turi</label><select id="f-tur" onchange="onFilter()">
      <option value="">Hammasi</option><option value="master">Master</option><option value="business_partner">Biznes partnyor</option><option value="limit">Limitdan oshgan</option>
    </select></div>
    <div class="fld" id="f-sort-w"><label>Saralash</label><select id="f-sort" onchange="onFilter()">
      <option value="kun">Muddati o'tgan kun</option><option value="otgan">O'tgan summa</option><option value="jami">Jami qarz</option><option value="limit">Limit foizi</option><option value="wallet">Hamyon</option><option value="ism">Ism</option><option value="fil">Filial</option>
    </select></div>
    <div class="fld" id="f-dir-w"><label>Tartib</label><select id="f-dir" onchange="onFilter()"><option value="desc">Kamayish (ko'p → kam)</option><option value="asc">O'sish (kam → ko'p)</option></select></div>
  </div>
</div>

<div class="ms-back" id="ms-back" onclick="msClose()"></div>
<div class="ms-sheet" id="ms-sheet" role="dialog">
  <div class="ms-head"><b id="ms-title">Tanlash</b><span class="ms-cnt" id="ms-cnt"></span></div>
  <div class="ms-search"><input id="ms-q" type="search" placeholder="Qidirish..." autocomplete="off" oninput="msRender()"></div>
  <div class="ms-list" id="ms-list"></div>
  <div class="ms-foot"><div onclick="msClear()">Tozalash</div><div class="ok" onclick="msClose()">Tayyor</div></div>
</div>

<div class="sortbar">
  <div class="cnt" id="cnt">—</div>
  <div class="reset" id="reset" onclick="resetFilters()">Filtrlarni tozalash</div>
</div>
<div class="list" id="list"><div class="loading"><div class="spinner"></div>Filiallar yuklanmoqda...</div></div>

<!-- TILXAT MODAL -->
<div id="tilxat-modal" class="mdl-back" onclick="if(event.target===this)closeTilxatModal()">
  <div style="background:var(--bg2);border-radius:20px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border)">
      <div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--violet);font-weight:700;text-transform:uppercase;letter-spacing:.5px"><svg class="lu" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>Tilxat</div>
        <div style="font-size:14px;font-weight:600;letter-spacing:-.2px;margin-top:3px" id="tilxat-modal-title">Tilxatlar</div>
      </div>
      <div class="ibtn" onclick="closeTilxatModal()" title="Yopish"><svg class="lu" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
    </div>

function fmt(n){ return Math.round(Number(n)||0).toLocaleString('uz-UZ'); }
function fmtShort(n){
  n = Number(n)||0; var a = Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+' mlrd';
  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+' mln';
  if(a>=1e3) return Math.round(n/1e3)+' ming';
  return fmt(n);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function telNorm(t){
  // "deleted1d137d9c-...+998335096767" kabi o'chirilgan akkaunt username'idan telefon ajratiladi
  var d = String(t||'').replace(/\D/g,'');
  if(d.length>12){ var m = d.match(/998\d{9}$/); if(m) d = m[0]; }
  return d;
}
function telPretty(t){
  var d = telNorm(t);
  if(d.length===12 && d.indexOf('998')===0) return '+998 '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8,10)+' '+d.slice(10);
  if(d.length===9) return '+998 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7);
  return String(t||'');
}
function kunClass(k){ return k>30?'red':(k>7?'amb':'grn'); }

// ===== Ma'lumot =====
var filials = [];        // {warehouse_id, filial, profil}
var filialMap = {};
var rows = [];           // tekis ro'yxat: har bir (filial, mijoz)
var statusFilter = 'otgan';
var failed = [];
var openId = null;

function load(force){
  if(!uid){ document.getElementById('list').innerHTML='<div class="err-box">URL da ?uid= topilmadi</div>'; return; }
  var btn = document.getElementById('refreshBtn'); btn.classList.add('spin');
  document.getElementById('list').innerHTML='<div class="loading"><div class="spinner"></div>Filiallar yuklanmoqda...</div>';
  document.getElementById('hdr-sub').textContent='Yuklanmoqda...';
  var now = new Date();
  var url = CEO_API+'?uid='+uid+'&oy='+(now.getMonth()+1)+'&yil='+now.getFullYear()+'&yarim='+(now.getDate()>15?2:1)+'&t='+Date.now();
  loadTilxatIds();
  fetch(url,{cache:'no-store'}).then(function(r){return r.text();}).then(function(txt){
    var d = parseSafe(txt);
    if(!d) throw new Error('Serverdan xato javob keldi');
    if(d.error==='unauthorized') throw new Error("Ruxsat yo'q: bu sahifa faqat CEO uchun");
    if(d.error) throw new Error(d.error);
    filials = (d.filiallar||[]).map(function(f){ return {warehouse_id:String(f.warehouse_id), filial:f.filial||('#'+f.warehouse_id), profil:f.profil||'', qarz_limit:Number(f.qarz_limit)||0}; });
    if(!filials.length) throw new Error('Filiallar topilmadi');
    filialMap = {}; filials.forEach(function(f){ filialMap[f.warehouse_id]=f; });
    fillFilialSelect();
    return loadAllDebtors();
  }).then(function(){
    btn.classList.remove('spin');
    document.getElementById('prog').style.display='none';
    onFilter();
  }).catch(function(e){
    btn.classList.remove('spin');
    document.getElementById('prog').style.display='none';
    document.getElementById('hdr-sub').textContent='Xato';
    document.getElementById('list').innerHTML='<div class="err-box">'+esc(e.message||e)+'</div>';
  });
}

function fillFilialSelect(){
  // mavjud bo'lmagan filial tanlovlari (yangilashdan keyin) olib tashlanadi
  Object.keys(msSel.fil).forEach(function(k){ if(!filialMap[k]) delete msSel.fil[k]; });
  msLabel('fil'); msLabel('cli');
}

// ===== Qidiruvli multiselect (filial / mijoz) =====
var msSel = { fil:{}, cli:{} };     // tanlanganlar: {id:true}
var msKind = null;
function msItems(kind){
  if(kind==='fil'){
    var cnt = {}; rows.forEach(function(r){ if(r.status==='otgan') cnt[r.wid]=(cnt[r.wid]||0)+1; });
    return filials.slice().sort(function(a,b){ return a.filial.localeCompare(b.filial,'uz'); })
      .map(function(f){ return {id:f.warehouse_id, t:f.filial, s:f.profil, n:(cnt[f.warehouse_id]||0)+" ta o'tgan"}; });
  }
  var seen = {}, out = [];
  rows.forEach(function(r){
    var k = String(r.id);
    if(seen[k]){ if(seen[k].s.indexOf(r.filial)<0) seen[k].s += ', '+r.filial; return; }
    seen[k] = {id:k, t:r.ism, s:r.filial, tel:telNorm(r.tel), n:'#'+k};
    out.push(seen[k]);
  });
  return out.sort(function(a,b){ return a.t.localeCompare(b.t,'uz',{sensitivity:'base'}); });
}
function msLabel(kind){
  var sel = Object.keys(msSel[kind]);
  var btn = document.getElementById('f-'+kind+'-btn');
  var txt = 'Hammasi';
  if(sel.length===1){
    txt = kind==='fil' ? ((filialMap[sel[0]]||{}).filial||sel[0]) : ((rows.filter(function(r){return String(r.id)===sel[0];})[0]||{}).ism||('#'+sel[0]));
  } else if(sel.length>1) txt = sel.length+' ta tanlangan';
  btn.textContent = txt; btn.title = txt;
  document.getElementById('f-'+kind+'-w').classList.toggle('on', sel.length>0);
}
function msOpen(kind){
  msKind = kind;
  document.getElementById('ms-title').textContent = kind==='fil' ? 'Filiallar' : 'Mijozlar';
  document.getElementById('ms-q').value = '';
  document.getElementById('ms-back').classList.add('open');
  document.getElementById('ms-sheet').classList.add('open');
  msRender();
  try{ if(window.innerWidth>=700) document.getElementById('ms-q').focus(); }catch(e){}
}
function msClose(){
  document.getElementById('ms-back').classList.remove('open');
  document.getElementById('ms-sheet').classList.remove('open');
  msKind = null;
}
function msRender(){
  if(!msKind) return;
  var q = document.getElementById('ms-q').value.trim().toLowerCase(), qNum = q.replace(/\D/g,'');
  var items = msItems(msKind), sel = msSel[msKind];
  if(q) items = items.filter(function(it){
    return it.t.toLowerCase().indexOf(q)>=0 || String(it.s||'').toLowerCase().indexOf(q)>=0 || String(it.id).indexOf(q)>=0
      || (qNum && ((it.tel||'').indexOf(qNum)>=0 || String(it.id).indexOf(qNum)>=0));
  });
  // tanlanganlar tepada
  items.sort(function(a,b){ var sa=sel[a.id]?0:1, sb=sel[b.id]?0:1; return sa-sb; });
  var n = Object.keys(sel).length;
  document.getElementById('ms-cnt').textContent = n ? n+' ta tanlangan' : 'hammasi';
  var html = items.slice(0,300).map(function(it){
    return '<div class="ms-item'+(sel[it.id]?' on':'')+'" onclick="msToggle(\''+esc(String(it.id))+'\')"><div class="ms-box"></div>'
      + '<div class="ms-t"><div>'+esc(it.t)+'</div>'+(it.s?'<span>'+esc(it.s)+(it.tel?' · '+esc(telPretty(it.tel)):'')+'</span>':'')+'</div>'
      + '<div class="ms-n">'+esc(it.n)+'</div></div>';
  }).join('');
  if(items.length>300) html += '<div class="empty" style="padding:14px">Yana '+(items.length-300)+' ta — qidiruvni aniqlashtiring</div>';
  if(!items.length) html = '<div class="empty" style="padding:24px">Topilmadi</div>';
  document.getElementById('ms-list').innerHTML = html;
}
function msToggle(id){
  var sel = msSel[msKind];
  if(sel[id]) delete sel[id]; else sel[id]=true;
  msLabel(msKind); msRender(); onFilter();
}
function msClear(){ msSel[msKind] = {}; msLabel(msKind); msRender(); onFilter(); }

// Har bir filial uchun kesh (bugun / ertaga / paslozim) — parallel, 6 tadan
function loadAllDebtors(){
  rows = []; failed = [];
  var done = 0, total = filials.length;
  var prog = document.getElementById('prog'), bar = document.getElementById('prog-bar');
  prog.style.display='block'; bar.style.width='0%';
  document.getElementById('list').innerHTML='<div class="loading"><div class="spinner"></div>Qarzdorlar yuklanmoqda... <span id="prog-txt">0/'+total+'</span></div>';
  var queue = filials.slice();
  function next(){
    var f = queue.shift();
    if(!f) return Promise.resolve();
    return fetch(DEBTORS_API+'?wid='+f.warehouse_id+'&t='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){ data = Array.isArray(data)?data[0]:data; addRows(f, data||{}); })
      .catch(function(){ failed.push(f.filial); })
      .then(function(){
        done++; bar.style.width = Math.round(done/total*100)+'%';
        var pt = document.getElementById('prog-txt'); if(pt) pt.textContent = done+'/'+total;
        return next();
      });
  }
  var workers = []; for(var i=0;i<6;i++) workers.push(next());
  return Promise.all(workers);
}

// index.html mapDebtorFromCache bilan bir xil mantiq:
//  O'tgan  = bugun so'rovi (deadline < bugun), kun = most_outdated_deadline, summa = o'tgan − hamyon
//  Bugun   = ertaga so'rovida MOD=1 (deadline = bugun)
//  Ertaga  = paslozim so'rovida MOD=1 (deadline = ertaga)
function addRows(f, data){
  var seen = {};
  function push(d, status){
    var key = String(d.id);
    if(seen[key]) return; seen[key]=true;
    var wallet = Number(d.wallet_balance)||0;
    var outdated = Number(d.total_outdated_debts)||0;
    var mod = Number(d.most_outdated_deadline)||0;
    var dad = Number(d.debt_allowed_days)||0;
    var limit = Number(d.debt_limit)||0;
    var total = Number(d.total_debts)||0;
    rows.push({
      key: f.warehouse_id+':'+key,
      id: d.id,
      ism: ((d.first_name||'')+' '+(d.last_name||'')).trim() || "Noma'lum",
      tel: d.username||'',
      wid: f.warehouse_id, filial: f.filial, profil: f.profil,
      status: status,
      kun: status==='otgan' ? Math.max(0,mod) : 0,
      otgan: Math.max(0, outdated - wallet),
      otgan_brutto: outdated,
      jami: total, wallet: wallet, limit: limit,
      limit_foiz: limit>0 ? Math.round(total/limit*100) : 0,
      dad: dad,
      tur: dad===1 ? 'master' : (dad>1 ? 'business_partner' : '')
    });
  }
  ((data.bugun&&data.bugun.debtors)||[]).forEach(function(d){ push(d,'otgan'); });
  ((data.ertaga&&data.ertaga.debtors)||[]).forEach(function(d){ if(Number(d.most_outdated_deadline)===1) push(d,'bugun'); });
  ((data.paslozim&&data.paslozim.debtors)||[]).forEach(function(d){ if(Number(d.most_outdated_deadline)===1) push(d,'ertaga'); });
}

  fetch(TILXAT_LIST)

}

function showTilxatModal(userId){
  var modal = document.getElementById('tilxat-modal');
  var body = document.getElementById('tilxat-modal-body');
  var titleEl = document.getElementById('tilxat-modal-title');
  modal.style.display = 'flex';
  titleEl.textContent = 'Tilxatlar';
  body.innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px;font-size:13px">Yuklanmoqda...</div>';

  if(tilxatCache[userId]){
    renderTilxatModal(userId, tilxatCache[userId]);
    return;
  }
  fetch(TILXAT_LIST + '?user_id=' + encodeURIComponent(userId))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = Array.isArray(d) ? d[0] : d;
      var arr = (data && data.tilxatlar) || [];
      tilxatCache[userId] = arr;
      renderTilxatModal(userId, arr);

      body.innerHTML = '<div style="text-align:center;color:var(--red);padding:30px;font-size:13px">Yuklanmadi</div>';
    });

function renderTilxatModal(userId, arr){
  var body = document.getElementById('tilxat-modal-body');
  var titleEl = document.getElementById('tilxat-modal-title');
  if(!arr.length){
    body.innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px;font-size:13px">Tilxat topilmadi</div>';
    return;
  }
  titleEl.textContent = (arr[0].ism || 'Mijoz') + ' — ' + arr.length + ' ta tilxat';
  var html = '';
  arr.forEach(function(t){
    var sana = (t.created_at||'').replace('T',' ').substring(0,16);
    var ext = (t.file_name||'').split('.').pop().toLowerCase();
    var icon = (ext==='pdf'||ext==='doc'||ext==='docx'||ext==='xls'||ext==='xlsx') ? ic('book',18,'var(--violet)') : ic('file-text',18,'var(--violet)');
    html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px">';

// ===================== RECORDINGS (index.html dan) =====================
function uploadRec(userId, ism, filial, umumiyQarz, wid){
  // Hidden file input yarataylik
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*,image/*,application/pdf,video/*';
  input.style.display = 'none';
  input.onchange = function(){
    if(!input.files || !input.files.length) return;
    var file = input.files[0];
    showRecCommentModal(userId, ism, filial, file, umumiyQarz, wid);
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){ document.body.removeChild(input); }, 1000);
}

// ===================== REC COMMENT MODAL =====================

          '</div>'+
        '</div>'+
        '<button class="ibtn" onclick="closeRecCommentModal()" title="Yopish">'+ic('x',17)+'</button>'+
      '</div>'+
      '<div style="padding:16px">'+
        '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:700">'+ic('alarm-clock',13)+'Budilnik uchun vaqt kiriting <span style="color:var(--red)">*</span></div>'+
        '<input type="datetime-local" id="rec-cm-dt" style="width:100%;padding:10px 12px;font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:14px">'+

function closeRecCommentModal(){
  var modal = document.getElementById('rec-comment-modal');
  if(modal) modal.style.display = 'none';
  _recPending = null;
}

function submitRecComment(){
  if(!_recPending) return;
  var izoh = (document.getElementById('rec-cm-izoh').value || '').trim();
  var dt = document.getElementById('rec-cm-dt').value || '';
  var remind = parseInt(document.getElementById('rec-cm-remind').value || '0', 10);
  if(!izoh){
    notify('Izoh kiritilishi shart!');
    document.getElementById('rec-cm-izoh').focus();
    return;
  }
  // Budilnik majburiy emas, lekin agar kiritilgan bo'lsa o'tgan vaqt bo'lmasin
  var waqtSql = '';
  if(dt){
    var nowUZB = new Date(new Date().getTime() + 5*60*60*1000);
    var todayStart = new Date(Date.UTC(nowUZB.getUTCFullYear(), nowUZB.getUTCMonth(), nowUZB.getUTCDate(), 0, 0, 0));
    var dtMs = new Date(dt).getTime();
    if(dtMs < todayStart.getTime()){
      notify('Budilnik sanasi bugungi yoki kelajakdagi bo\'lishi kerak!');
      document.getElementById('rec-cm-dt').focus();
      return;
    }
    waqtSql = dt.replace('T',' ')+':00';
  }
  var p = _recPending;
  closeRecCommentModal();
  doUploadRec(p.userId, p.ism, p.filial, p.file, izoh, waqtSql, remind, p.umumiyQarz, p.wid);
}

function doUploadRec(userId, ism, filial, file, izoh, waqtSql, remind, umumiyQarz, wid){
  // Toast / progress
  var toast = document.createElement('div');
  toast.id = 'rec-toast';
  toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:700;color:var(--text);z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.4)';
  toast.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid var(--bg3);border-top-color:#3B6D11;border-radius:50%;animation:rot 1s linear infinite;margin-right:8px;vertical-align:middle"></span>Saqlanmoqda...';
  document.body.appendChild(toast);

  var fd = new FormData();
  if(file) fd.append('file', file, file.name);
  fd.append('user_id', String(userId));
  fd.append('ism', ism||'');
  fd.append('filial', filial||'');
  fd.append('file_name', file ? file.name : '');
  fd.append('izoh', izoh||'');
  fd.append('budilnik_dt', waqtSql||'');
  fd.append('remind_minutes_before', String(remind||0));
  fd.append('umumiy_qarz', String(umumiyQarz||0));
  fd.append('warehouse_id', String(wid||''));
  fd.append('hodim_telegram_id', String(uid||''));
  fd.append('izoh_only', file ? 'false' : 'true');

  getHodimIsmi().then(function(hodimIsmi){
    fd.append('hodim_ismi', hodimIsmi||'');
    return fetch(REC_UPLOAD_API, { method: 'POST', body: fd });
  })
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d; try{ var raw=JSON.parse(txt); d=Array.isArray(raw)?raw[0]:raw; }catch(e){ d=null; }
      toast.innerHTML = (d && d.ok) ? (ic('check-circle-2',15)+' Saqlandi va Telegram\'ga yuborildi') : (ic('x-circle',15)+' Xato: '+(d&&d.error||'noma\'lum'));
      toast.style.color = (d && d.ok) ? 'var(--green)' : 'var(--red)';
      setTimeout(function(){ toast.remove(); }, 2500);
      // Cache tozalaymiz va kartochka ochiq bo'lsa qayta yuklaymiz
      delete recordingsCache[userId];
      var recEl = document.getElementById('rec-'+userId);
      if(recEl){
        loadRecordings(userId);
      }
    })
    .catch(function(e){
      toast.innerHTML = ic('x-circle',15)+' Tarmoq xatosi';
      toast.style.color = 'var(--red)';
      setTimeout(function(){ toast.remove(); }, 2500);
    });
}

function loadRecordings(userId){
  var el = document.getElementById('rec-'+userId);
  if(!el) return;
  if(recordingsCache[userId] !== undefined){
    renderRecordings(userId, recordingsCache[userId]);
    return;
  }
  el.innerHTML = '<div style="padding:6px 12px;font-size:11px;color:var(--text3)">Yozuvlar yuklanmoqda...</div>';
  fetch(REC_LIST_API+'?user_id='+userId)
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d; try{ var raw=JSON.parse(txt); d=Array.isArray(raw)?raw[0]:raw; }catch(e){ d=null; }
      var recs = (d && d.recordings) || [];
      recordingsCache[userId] = recs;
      renderRecordings(userId, recs);
    })
    .catch(function(){
      recordingsCache[userId] = [];
      renderRecordings(userId, []);
    });
}

function renderRecordings(userId, recs){
  var el = document.getElementById('rec-'+userId);
  if(!el) return;
  // API yozuvi yo'q mijozga ham bo'sh placeholder qaytaradi — o'shani tashlaymiz
  recs = (recs||[]).filter(function(r){ return r.id || r.file_id || r.izoh || r.created_at; });
  if(!recs.length){ el.innerHTML = ''; return; }
  // Sana-vaqt formatlash (PG timestamp -> dd.mm.yyyy hh:mm)
  function fmtPgDt(s){
    if(!s) return '';
    var str = String(s);
    var datePart = str.split(/[T ]/)[0];
    var timePart = '';
    if(str.indexOf('T')!==-1 || str.indexOf(' ')!==-1){
      var t = str.split(/[T ]/)[1] || '';
      timePart = t.substring(0,5);
    }
    var parts = datePart.split('-');
    if(parts.length===3) return parts[2]+'.'+parts[1]+'.'+parts[0]+(timePart?' '+timePart:'');
    return str;
  }
  // Meta block (izoh + budilnik + hodim)
  function metaBlock(rec){
    var html = '';
    var createdFmt = fmtPgDt(rec.created_at);
    if(rec.izoh){
      html += '<div style="display:flex;align-items:flex-start;gap:6px;margin-top:6px;padding:8px 10px;background:var(--tint-amber);border-left:3px solid var(--amber);border-radius:6px;font-size:12px;color:var(--text);line-height:1.4">'+ic('pencil',13,'var(--amber)','margin-top:1px')+'<span>'+esc(rec.izoh)+'</span></div>';
    }
    // Budilnik bloki
    if(rec.budilnik_dt){
      var budFmt = fmtPgDt(rec.budilnik_dt);
      var sentBadge = rec.budilnik_sent ? '<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(34,197,94,.2);color:var(--green);margin-left:6px">YUBORILDI</span>' : '<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(245,158,11,.2);color:#f59e0b;margin-left:6px">KUTILMOQDA</span>';
      var remind = rec.remind_minutes_before ? (' · '+rec.remind_minutes_before+' daq oldin') : '';
      html += '<div style="display:flex;align-items:flex-start;gap:6px;margin-top:5px;padding:8px 10px;background:rgba(139,92,246,.09);border-left:3px solid #8b5cf6;border-radius:6px;font-size:12px;color:var(--text);line-height:1.4">'+ic('alarm-clock',13,'#8b5cf6','margin-top:1px')+'<span><strong style="font-weight:600">Budilnik:</strong> '+budFmt+remind+sentBadge+'</span></div>';
    }
    var infoLine = [];
    if(createdFmt) infoLine.push(ic('clock',12) + ' ' + createdFmt);
    if(rec.hodim_ismi || rec.hodim_telegram_id) infoLine.push(ic('user',12) + ' ' + (rec.hodim_ismi ? esc(rec.hodim_ismi) : 'ID ' + esc(rec.hodim_telegram_id)));
    if(infoLine.length){
      html += '<div style="font-size:11px;color:var(--text3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">';
      infoLine.forEach(function(s){ html += '<span style="display:inline-flex;align-items:center;gap:4px">'+s+'</span>'; });
      html += '</div>';
    }
    return html;
  }
  var html = '<div style="padding:4px 0 2px"><div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:700">'+ic('clipboard-list',13)+'Yozuvlar ('+recs.length+' ta)</div>';
  recs.forEach(function(rec){
    var isAudio = (rec.mime_type||'').indexOf('audio') === 0;
    var isImage = (rec.mime_type||'').indexOf('image') === 0;
    var isVideo = (rec.mime_type||'').indexOf('video') === 0;
    var streamUrl = rec.stream_link || '';
    // Izoh-only (fayl yo'q) yoki fayl yo'qolgan
    if(rec.izoh_only || !rec.file_id || !rec.file_exists){
      var emptyLabel = rec.izoh_only ? 'Izoh yozuvi' : (rec.file_id && !rec.file_exists ? 'Izoh (fayl Drive\'dan o\'chirilgan)' : 'Izoh');
      html += '<div style="margin-bottom:8px;background:var(--tint-amber);border:1px dashed var(--tint-amber-b);border-radius:10px;padding:9px">';
      html += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);margin-bottom:2px">'+ic('pencil',12)+emptyLabel+'</div>';
      html += metaBlock(rec);
      html += '</div>';
      return;
    }
    // Fayl mavjud
    if(isAudio){
      html += '<div style="margin-bottom:8px;background:rgba(55,138,221,.06);border-radius:8px;padding:8px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">';
      html += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);flex:1;min-width:0"><span style="display:flex;flex-shrink:0">'+ic('music',13)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(rec.name)+'</span></div>';
      html += '<a href="'+esc(rec.web_view_link)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:var(--tint-blue);border:0.5px solid var(--tint-blue-b);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--blue);text-decoration:none;flex-shrink:0">'+ic('link',12)+'Drive</a>';
      html += '</div>';
      html += '<audio controls preload="metadata" src="'+esc(streamUrl)+'" style="width:100%;height:36px"></audio>';
      html += metaBlock(rec);
      html += '</div>';
    } else if(isVideo){
      html += '<div style="margin-bottom:8px;background:rgba(55,138,221,.06);border-radius:8px;padding:8px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">';
      html += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);flex:1;min-width:0"><span style="display:flex;flex-shrink:0">'+ic('video',13)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(rec.name)+'</span></div>';
      html += '<a href="'+esc(rec.web_view_link)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:var(--tint-blue);border:0.5px solid var(--tint-blue-b);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--blue);text-decoration:none;flex-shrink:0">'+ic('link',12)+'Drive</a>';
      html += '</div>';
      html += '<video controls preload="metadata" src="'+esc(streamUrl)+'" style="width:100%;max-height:200px;border-radius:6px"></video>';
      html += metaBlock(rec);
      html += '</div>';
    } else if(isImage){
      html += '<div style="margin-bottom:8px;background:rgba(55,138,221,.06);border-radius:8px;padding:8px">';
      html += '<div style="display:flex;align-items:center;gap:8px">';
      html += '<a href="'+esc(rec.web_view_link)+'" target="_blank" style="text-decoration:none;flex-shrink:0"><img src="'+esc(streamUrl)+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover"></a>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div class="rec-name" style="display:flex;align-items:center;gap:5px"><span style="display:flex;flex-shrink:0">'+ic('camera',13)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(rec.name)+'</span></div>';
      html += '</div>';
      html += '<a href="'+esc(rec.web_view_link)+'" target="_blank" title="Drive" style="display:inline-flex;align-items:center;justify-content:center;background:var(--tint-blue);border:0.5px solid var(--tint-blue-b);border-radius:8px;padding:6px 10px;color:var(--blue);text-decoration:none;flex-shrink:0">'+ic('link',13)+'</a>';
      html += '</div>';
      html += metaBlock(rec);
      html += '</div>';
    } else {
      html += '<div style="margin-bottom:8px;background:rgba(55,138,221,.06);border-radius:8px;padding:8px">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">';
      html += '<div style="flex:1;min-width:0">';
      html += '<div class="rec-name" style="display:flex;align-items:center;gap:5px"><span style="display:flex;flex-shrink:0">'+ic('file-text',13)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(rec.name)+'</span></div>';
      html += '</div>';
      html += '<a href="'+esc(rec.web_view_link)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:var(--tint-blue);border:0.5px solid var(--tint-blue-b);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--blue);text-decoration:none;flex-shrink:0">'+ic('link',12)+'Ochish</a>';
      html += '</div>';
      html += metaBlock(rec);
      html += '</div>';
    }
  });
  html += '</div>';
  el.innerHTML = html;
}

  ['f-prof','f-kun','f-sum','f-tur'].forEach(function(id){ document.getElementById(id).value=''; });
  msSel = { fil:{}, cli:{} }; msLabel('fil'); msLabel('cli');
  document.getElementById('f-sort').value='kun'; document.getElementById('f-dir').value='desc';
  document.getElementById('q').value=''; statusFilter='otgan'; onFilter();
}
function applyBase(list, skipStatus){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var qNum = q.replace(/\D/g,'');
  var filSel = msSel.fil, filAny = Object.keys(filSel).length>0;
  var cliSel = msSel.cli, cliAny = Object.keys(cliSel).length>0;
  var prof = document.getElementById('f-prof').value;
  var kun = document.getElementById('f-kun').value;
  var sum = Number(document.getElementById('f-sum').value)||0;
  var tur = document.getElementById('f-tur').value;
  var kMin=0,kMax=Infinity;
  if(kun){ var p=kun.split('-'); kMin=Number(p[0])||0; kMax=p[1]?Number(p[1]):Infinity; }
  return list.filter(function(r){
    if(!skipStatus && statusFilter!=='all' && r.status!==statusFilter) return false;
    if(filAny && !filSel[r.wid]) return false;
    if(cliAny && !cliSel[String(r.id)]) return false;
    if(prof && r.profil!==prof) return false;
    if(kun && (r.kun<kMin || r.kun>kMax)) return false;
    if(sum && (r.status==='otgan' ? r.otgan : r.otgan_brutto) < sum) return false;
    if(tur==='limit'){ if(!(r.limit>0 && r.jami>r.limit)) return false; }
    else if(tur && r.tur!==tur) return false;
    if(q){
      var tel = String(r.tel).toLowerCase(), telNum = tel.replace(/\D/g,'');
      var hit = r.ism.toLowerCase().indexOf(q)>=0 || String(r.id).indexOf(q)>=0 || tel.indexOf(q)>=0 || r.filial.toLowerCase().indexOf(q)>=0;
      if(!hit && qNum && (String(r.id).indexOf(qNum)>=0 || telNum.indexOf(qNum)>=0)) hit=true;
      if(!hit) return false;
    }
    return true;
  });
}
function onFilter(){
  if(!rows.length && !filials.length) return;
  var sortKey = document.getElementById('f-sort').value;
  var dir = document.getElementById('f-dir').value==='asc' ? 1 : -1;
  var list = applyBase(rows, false);
  list.sort(function(a,b){
    var va, vb;
    switch(sortKey){
      case 'otgan': va=a.otgan; vb=b.otgan; break;
      case 'jami': va=a.jami; vb=b.jami; break;
      case 'limit': va=a.limit_foiz; vb=b.limit_foiz; break;
      case 'wallet': va=a.wallet; vb=b.wallet; break;
      case 'ism': return dir * -1 * a.ism.localeCompare(b.ism,'uz',{sensitivity:'base'});
      case 'fil': var c=a.filial.localeCompare(b.filial,'uz'); if(c) return dir*-1*c; va=a.kun; vb=b.kun; break;
      default: va=a.kun; vb=b.kun;
    }
    if(va!==vb) return dir*(va-vb);
    if(a.otgan!==b.otgan) return b.otgan-a.otgan;         // teng bo'lsa: summasi kattasi tepada
    return a.ism.localeCompare(b.ism,'uz',{sensitivity:'base'});
  });

  // status chiplari (boshqa filtrlardan keyingi sonlar)
  var base = applyBase(rows, true);
  var cnt = {otgan:0,bugun:0,ertaga:0};
  base.forEach(function(r){ cnt[r.status]++; });
  var chips = [
    {k:'otgan', t:"Muddati o'tgan", c:''},
    {k:'bugun', t:'Bugun muddati', c:'amb'},
    {k:'ertaga', t:'Ertaga muddati', c:'blu'},
    {k:'all', t:'Hammasi', c:'neu'}
  ];
  document.getElementById('status-chips').innerHTML = chips.map(function(c){
    var n = c.k==='all' ? base.length : cnt[c.k];
    return '<div class="chip '+(statusFilter===c.k?'on '+c.c:'')+'" onclick="setStatus(\''+c.k+'\')">'+c.t+' <b>'+n+'</b></div>';
  }).join('');

  // jami
  var sOtgan=0, sJami=0;
  list.forEach(function(r){ sOtgan+=r.otgan; sJami+=r.jami; });
  document.getElementById('s-cnt').textContent = list.length;
  document.getElementById('s-cnt-s').textContent = list.length===rows.length ? 'barcha filiallar' : ('jami '+rows.length+' tadan');
  document.getElementById('s-otgan').textContent = fmtShort(sOtgan);
  document.getElementById('s-otgan').title = fmt(sOtgan)+" so'm";
  document.getElementById('s-jami').textContent = fmtShort(sJami);
  document.getElementById('s-jami').title = fmt(sJami)+" so'm";
  document.getElementById('cnt').innerHTML = '<b>'+list.length+'</b> ta qarzdor · '+filials.length+' filial'+(failed.length?' · <span style="color:var(--amber)">'+failed.length+' filial yuklanmadi</span>':'');
  document.getElementById('hdr-sub').textContent = rows.filter(function(r){return r.status==='otgan';}).length+" ta muddati o'tgan · "+new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
  var note = document.getElementById('note');
  if(failed.length){ note.style.display='block'; note.textContent='Yuklanmadi: '+failed.join(', ')+' — «Yangilash» bosing'; } else note.style.display='none';

  // filtr holati belgilari
  var anyF = false;
  if(Object.keys(msSel.fil).length || Object.keys(msSel.cli).length) anyF = true;
  [['f-prof','f-prof-w'],['f-kun','f-kun-w'],['f-sum','f-sum-w'],['f-tur','f-tur-w']].forEach(function(p){
    var on = !!document.getElementById(p[0]).value; if(on) anyF=true;
    document.getElementById(p[1]).classList.toggle('on', on);
  });
  var q = document.getElementById('q').value;
  document.getElementById('q-clr').style.display = q ? 'flex' : 'none';
  var sortDefault = document.getElementById('f-sort').value==='kun' && document.getElementById('f-dir').value==='desc';
  document.getElementById('reset').style.display = (anyF || q || statusFilter!=='otgan' || !sortDefault) ? 'block' : 'none';

  render(list);
}

function render(list){
  var el = document.getElementById('list');
  if(!list.length){ el.innerHTML='<div class="empty">Shartlarga mos qarzdor topilmadi</div>'; return; }
  var html = '';
  var max = 400, shown = list.slice(0,max);
  shown.forEach(function(r){
    var utShort = r.tur==='master' ? 'M' : (r.tur==='business_partner' ? 'BP' : '?');
    var utColor = r.tur==='master' ? 'var(--blue)' : (r.tur==='business_partner' ? 'var(--violet)' : 'var(--text3)');
    var kunTag = r.status==='otgan'
      ? '<span class="tag '+kunClass(r.kun)+'">'+r.kun+' kun o\'tgan</span>'
      : (r.status==='bugun' ? '<span class="tag amb">bugun muddati</span>' : '<span class="tag blu">ertaga muddati</span>');
    var mainSum = r.status==='otgan' ? r.otgan : r.otgan_brutto;
    html += '<div class="row'+(openId===r.key?' open':'')+'" onclick="toggleRow(\''+r.key+'\')">';
    html += '<div class="row-top">';
    html += '<div class="av" style="color:'+utColor+'">'+utShort+'</div>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div class="r-name">'+esc(r.ism)+'</div>';
    html += '<div class="r-meta"><span class="tag id">#'+r.id+'</span>'+kunTag+'<span class="tag fil" title="'+esc(r.filial)+'">'+esc(r.filial)+'</span>'+tilxatBadge(r.id)+'</div>';
    if(r.tel) html += '<div class="r-tel" style="margin-top:4px">'+esc(telPretty(r.tel))+'</div>';
    html += '</div>';
    html += '<div class="r-right"><div class="r-sum num">'+fmt(mainSum)+'</div>';
    html += '<div class="r-sub num">jami '+fmtShort(r.jami)+(r.wallet>0?' · <span style="color:var(--green)">hamyon '+fmtShort(r.wallet)+'</span>':'')+'</div></div>';
    html += '</div>';
    // tafsilot
    html += '<div class="r-det"><div class="kv">';
    html += '<div><span>Muddati o\'tgan (brutto)</span><b class="num">'+fmt(r.otgan_brutto)+'</b></div>';
    html += '<div><span>Hamyon</span><b class="num" style="color:var(--green)">'+fmt(r.wallet)+'</b></div>';
    html += '<div><span>Jami qarz</span><b class="num">'+fmt(r.jami)+'</b></div>';
    html += '<div><span>Limit</span><b class="num">'+(r.limit?fmt(r.limit)+' · '+r.limit_foiz+'%':'—')+'</b></div>';
    html += '<div><span>Qarz muddati</span><b>'+(r.dad?r.dad+' kun':'—')+'</b></div>';
    html += '<div><span>Turi</span><b>'+(r.tur==='master'?'Master':(r.tur==='business_partner'?'Biznes partnyor':'—'))+'</b></div>';
    html += '</div>';
    if(openId===r.key) html += '<div class="rec-wrap" id="rec-'+r.id+'"></div>';
    html += '<div class="acts">';
    html += '<div onclick="event.stopPropagation();uploadRecRow(\''+r.key+'\')">'+ic('paperclip',14)+'Yuklash</div>';
    if(r.tel) html += '<a href="tel:+'+esc(telNorm(r.tel))+'" onclick="event.stopPropagation()"><svg class="lu" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Qo\'ng\'iroq</a>';
    html += '<div class="pri" onclick="event.stopPropagation();openFilial(\''+r.wid+'\')"><svg class="lu" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>Filial sahifasi</div>';
    html += '</div></div>';
    html += '</div>';
  });
  if(list.length>max) html += '<div class="empty">Yana '+(list.length-max)+' ta — filtrni toraytiring</div>';
  el.innerHTML = html;
  // ochiq qator yozuvlarini (keshdan yoki API'dan) ko'rsatamiz
  var open = list.slice(0,max).filter(function(r){ return r.key===openId; })[0];
  if(open) loadRecordings(open.id);
}
function toggleRow(key){ openId = (openId===key) ? null : key; onFilter(); }
function openFilial(wid){
  var curPage = window.location.pathname.split('/').pop() || '';
  var isDev = curPage.indexOf('-dev') !== -1;
  var basePath = window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
  var now = new Date();
  var url = basePath + (isDev?'index-dev.html':'index.html') + '?uid=' + uid + '&wid=' + wid + '&oy=' + (now.getMonth()+1) + '&yil=' + now.getFullYear() + '&yarim=' + (now.getDate()>15?2:1);
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) window.Telegram.WebApp.openLink(url);
  else window.open(url,'_blank');
}

if(window.Telegram && window.Telegram.WebApp){ try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }catch(e){} }
load();
</script>
