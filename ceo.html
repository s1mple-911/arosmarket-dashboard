<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AROS">
<meta name="theme-color" content="#7BC93F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="apple-touch-startup-image" href="icons/splash-iphone-pro-max.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="icons/splash-iphone.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="icons/splash-iphone.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="icons/splash-ipad.png" media="(device-width: 810px) and (device-height: 1080px)">
<link rel="apple-touch-startup-image" href="icons/splash-iphone.png">
<title>AROS CEO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
/* --- Palitra (dark) --- */
--bg:#060610;--bg2:#0e0e20;--bg3:#161628;--border:#1e1e38;
--text:#f0f0ff;--text2:#9393b8;--text3:#5e5e83;
--green:#00e5a0;--green-bg:rgba(0,229,160,.12);--green-border:rgba(0,229,160,.28);
--red:#ff4d6d;--amber:#ffb800;
--blue:#378ADD;--violet:#a855f7;--purple:#a855f7;--cyan:#22d3ee;
/* --- Radius shkalasi --- */
--r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
/* --- Status tint'lari (dark) --- */
--tint-green:rgba(0,229,160,.13);  --tint-green-b:rgba(0,229,160,.28);
--tint-amber:rgba(255,184,0,.13);  --tint-amber-b:rgba(255,184,0,.30);
--tint-red:rgba(255,77,109,.13);   --tint-red-b:rgba(255,77,109,.30);
--tint-blue:rgba(55,138,221,.14);  --tint-blue-b:rgba(55,138,221,.32);
--tint-violet:rgba(168,85,247,.15);--tint-violet-b:rgba(168,85,247,.32);
--tint-neutral:rgba(148,148,190,.13);--tint-neutral-b:rgba(148,148,190,.26);
--shadow-card:none;
}
[data-theme="light"]{
--bg:#f4f4fa;--bg2:#ffffff;--bg3:#f1f1f7;--border:#e2e2ee;
--text:#0a0a1a;--text2:#54546e;--text3:#84849c;
/* Light'da ochiq ranglar kontrastsiz — quyuqroq variant */
--green:#00875a;--green-bg:rgba(0,135,90,.10);--green-border:rgba(0,135,90,.28);
--red:#d92646;--amber:#a06400;
--blue:#185FA5;--violet:#7C3AED;--purple:#7C3AED;--cyan:#0e7490;
/* Light'da rgba(...,.15) juda kuchsiz — alohida qiymatlar */
--tint-green:rgba(0,135,90,.10);   --tint-green-b:rgba(0,135,90,.24);
--tint-amber:rgba(160,100,0,.11);  --tint-amber-b:rgba(160,100,0,.26);
--tint-red:rgba(217,38,70,.09);    --tint-red-b:rgba(217,38,70,.24);
--tint-blue:rgba(24,95,165,.10);   --tint-blue-b:rgba(24,95,165,.26);
--tint-violet:rgba(124,58,237,.10);--tint-violet-b:rgba(124,58,237,.26);
--tint-neutral:rgba(30,30,60,.06); --tint-neutral-b:rgba(30,30,60,.16);
--shadow-card:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
input,select,button,textarea{font-family:inherit}
/* Lucide ikon bazasi */
.lu{display:inline-block;vertical-align:middle;flex-shrink:0}
/* Pul/foiz raqamlari — bir xil kenglikdagi raqamlar */
.jami-summa,.jami-foiz,.jami-nums,.jq-val,.fc-foiz,.fc-nums,.fc-m-val,.sc-val,.sc-sub,.tb-val,.c-amt{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--r-xs)}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--green);letter-spacing:2px;flex-shrink:0}
.dev-badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:var(--r-xs);background:var(--tint-amber);color:var(--amber);border:1px solid var(--tint-amber-b);flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-size:14px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Header ikon tugmalari — 36px teginish zonasi */
.theme-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text2);transition:transform .12s ease,background .15s ease,color .15s ease}
.theme-btn:active{transform:scale(.92)}
.bug-btn{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  border:none;display:none;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;
  box-shadow:0 2px 8px rgba(139,92,246,0.35);
  transition:transform .12s ease, box-shadow .15s ease;
  flex-shrink:0;
}
.bug-btn:active{transform:scale(0.92);box-shadow:0 1px 4px rgba(139,92,246,0.3)}
/* Menejer tab'lari */
.mgr-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.mgr-tab{flex:1;min-height:44px;padding:10px 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:-.1px;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:color .18s ease,border-color .18s ease}
.filter-bar{padding:12px 14px 0;display:flex;gap:8px}
.filter-bar select{flex:1;min-width:0;min-height:40px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;color:var(--text);font-size:13px;outline:none;appearance:none;-webkit-appearance:none;font-weight:600;cursor:pointer}
.refresh-btn{width:40px;height:40px;border-radius:var(--r-md);background:var(--tint-green);border:1px solid var(--tint-green-b);color:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s ease}
.refresh-btn:active{transform:scale(.94)}
.page{padding:14px}
/* --- Kompaniya jami --- */
.jami-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.jami-label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.jami-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.jami-summa{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--green);letter-spacing:1px;line-height:1}
.jami-foiz{font-size:24px;font-weight:800;color:var(--text2);letter-spacing:-.8px;line-height:1}
.jami-bar-bg{background:var(--bg3);border-radius:var(--r-full);height:8px;margin-bottom:8px;overflow:hidden}
.jami-bar{height:100%;border-radius:var(--r-full);background:var(--green);transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.jami-nums{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:8px}
.jami-nums b{color:var(--text);font-weight:700}
.jami-qarz{display:flex;gap:8px;margin-top:8px}
.jq-box{flex:1;min-width:0;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--r-md);padding:10px}
.jq-lbl{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:-.1px;line-height:1.25;margin-bottom:4px}
.jq-val{font-size:13px;font-weight:800;letter-spacing:-.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.sec-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-full);background:var(--tint-green);color:var(--green);border:1px solid var(--tint-green-b)}
/* --- Filial kartochkasi (asosiy ekran) --- */
.filial-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .12s ease,border-color .15s ease}
.filial-card:active{transform:scale(.985)}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.fc-top>div:first-child{min-width:0}
.fc-name{font-size:15px;font-weight:800;letter-spacing:-.3px;text-transform:capitalize;line-height:1.25}
.fc-oy{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.3}
.fc-foiz{font-size:26px;font-weight:800;line-height:1;letter-spacing:-1px}
.fc-bar-bg{background:var(--bg3);border-radius:var(--r-full);height:6px;margin-bottom:8px;overflow:hidden}
.fc-bar{height:100%;border-radius:var(--r-full);transition:width 1s cubic-bezier(.22,1,.36,1)}
.fc-nums{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text3);margin-bottom:8px}
.fc-nums b{color:var(--text);font-weight:700}
.fc-mini{display:flex;gap:8px;margin-bottom:8px}
.fc-m{flex:1;min-width:0;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--r-md);padding:8px 10px}
.fc-m-lbl{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:-.1px;line-height:1.25;margin-bottom:4px}
.fc-m-val{font-size:12px;font-weight:800;letter-spacing:-.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-m-sub{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.25}
.fc-qarz{background:var(--tint-red);border:1px solid var(--tint-red-b);border-radius:var(--r-sm);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.fc-qarz-lbl{color:var(--text2);font-weight:600}
.fc-qarz-val{font-weight:800;color:var(--red)}
.fc-prognoz{margin-top:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--r-sm);font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.fc-loading{position:absolute;inset:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;border-radius:var(--r-lg)}
.mini-spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
/* --- Detal paneli --- */
.det-panel{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.det-panel.open{display:flex}
.det-hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.det-back{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s ease}
.det-back:active{transform:scale(.92)}
.det-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.det-tab{flex:1;min-height:44px;padding:10px 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:-.1px;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:color .18s ease,border-color .18s ease}
.det-tab.active{color:var(--green);border-bottom-color:var(--green)}
.det-body{flex:1;overflow-y:auto}
.det-page{display:none;padding:14px}
.det-page.active{display:block}
.progress-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-card)}
.sc-lbl{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;letter-spacing:-.1px}
.sc-val{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.sc-sub{font-size:11px;color:var(--text3);margin-top:4px}
.total-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb-lbl{font-size:12px;color:var(--text2);font-weight:600}
.tb-val{font-size:16px;font-weight:800;letter-spacing:-.3px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-full)}
.b-red{background:var(--tint-red);color:var(--red);border:1px solid var(--tint-red-b)}
.b-amber{background:var(--tint-amber);color:var(--amber);border:1px solid var(--tint-amber-b)}
.client-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.client-main{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px;cursor:pointer}
.c-av{width:38px;height:38px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text2);flex-shrink:0;border:1px solid var(--border);letter-spacing:.2px}
.c-info{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:700;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-phone{font-size:11px;color:var(--text3);margin-top:2px}
.c-right{text-align:right;flex-shrink:0}
.c-amt{font-size:13px;font-weight:800;letter-spacing:-.2px}
.call-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--tint-green-b);background:var(--tint-green);color:var(--green);text-decoration:none;transition:transform .12s ease}
.call-btn:active{transform:scale(.92)}
.arr{color:var(--text3);flex-shrink:0;margin-left:4px;display:inline-flex;align-items:center;transition:transform .2s ease}
.arr.open{transform:rotate(180deg)}
.orders-list{border-top:1px solid var(--border);background:var(--bg3);max-height:0;overflow:hidden;transition:max-height .5s ease}
.orders-list.exp{max-height:2000px}
.order-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 10px 60px;border-bottom:1px solid var(--border)}
.order-row:last-child{border-bottom:none}
.loading{text-align:center;padding:60px 16px;color:var(--text3);font-size:13px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes brdAmber{0%,100%{border-color:rgba(255,159,10,0.3)}50%{border-color:rgba(255,159,10,0.85)}}
@keyframes brdBlue{0%,100%{border-color:rgba(55,138,221,0.3)}50%{border-color:rgba(55,138,221,0.85)}}
.tr-onway{animation:brdAmber 2s ease-in-out infinite}
.tr-created{animation:brdBlue 2s ease-in-out infinite}
.empty{text-align:center;padding:60px 16px}
.et{font-size:13px;color:var(--text3)}
.err-box{background:var(--tint-red);border:1px solid var(--tint-red-b);border-radius:var(--r-md);padding:14px;font-size:13px;color:var(--red);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.kechikish-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:var(--r-xs);font-size:11px;font-weight:600;white-space:nowrap;line-height:1.2}
.kechikish-badge.kech-warn{background:var(--tint-amber);color:var(--amber);border:1px solid var(--tint-amber-b)}
.kechikish-badge.kech-bad{background:var(--tint-red);color:var(--red);border:1px solid var(--tint-red-b)}
.kechikish-badge.kech-crit{background:var(--red);color:#fff;border:1px solid var(--red);animation:kechPulse 1.8s infinite}
@keyframes kechPulse{0%,100%{opacity:1}50%{opacity:.65}}
.kech-ok{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:var(--r-xs);font-size:11px;background:var(--tint-green);color:var(--green);border:1px solid var(--tint-green-b);font-weight:600;line-height:1.2}
.tr-auto{display:inline-block;padding:2px 5px;border-radius:var(--r-xs);font-size:11px;background:var(--tint-violet);color:var(--violet);font-weight:700;letter-spacing:.3px;line-height:1.2}
/* Qidiruv input'i — placeholder ichida SVG ishlamaydi, ikon absolute */
.srch{position:relative}
.srch-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;color:var(--text3);pointer-events:none}
.srch input{width:100%;min-height:44px;padding:11px 12px 11px 38px;font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);outline:none}
.srch input::placeholder{color:var(--text3)}
/* Modal yopish tugmasi */
.x-btn{background:var(--bg3);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;flex-shrink:0;transition:transform .12s ease}
.x-btn:active{transform:scale(.92)}
/* Kichik ekranlar (360px) — header siqilmasin */
@media (max-width:400px){
  .hdr{gap:6px;padding:10px}
  .hdr-logo{font-size:20px;letter-spacing:1.5px}
  .theme-btn,.bug-btn{width:34px;height:34px}
}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

<body>

<div class="hdr">
  <div class="hdr-logo">AROS</div>
  
  <div class="hdr-info">
    <div class="hdr-title" id="hdr-title">CEO Dashboard</div>
    <div class="hdr-sub" id="hdr-sub">Yuklanmoqda...</div>
  </div>
  <div id="tasksBtn" class="bug-btn" onclick="goTasks()" title="Vazifalar" style="display:none;background:var(--tint-green);border:1px solid var(--tint-green-b);box-shadow:none;color:var(--green)"><svg class="lu" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></div>

(function authCheck(){
  if(uid) return; // Telegram Mini App
  var token = localStorage.getItem('aros-token');
  if(!token){ window.location.href = 'login.html'; return; }
  try {
    var userJson = localStorage.getItem('aros-user');
    if(userJson){
      var u = JSON.parse(userJson);
      if(u && u.telegram_id){
        uid = u.telegram_id;
        try{
          var newUrl = window.location.pathname + '?uid=' + encodeURIComponent(uid);
          window.history.replaceState({}, '', newUrl);
        }catch(e){}
      }
    }
  } catch(e){}
  fetch('https://n8n.arosmarket.com/webhook/aros-verify-token', {
    method:'POST',
    body: JSON.stringify({token: token})
  }).then(function(r){return r.json();}).then(function(d){
    var data = Array.isArray(d) ? d[0] : d;
    if(!data || !data.ok){
      localStorage.removeItem('aros-token');
      localStorage.removeItem('aros-user');
      window.location.href = 'login.html';
    }
  }).catch(function(){});
})();

function doLogout(){
  if(!confirm('Chiqmoqchimisiz?')) return;
  var token = localStorage.getItem('aros-token');
  if(token){
    fetch('https://n8n.arosmarket.com/webhook/aros-logout', {
      method:'POST',
      body: JSON.stringify({token: token})
    }).catch(function(){});
  }
  localStorage.removeItem('aros-token');
  localStorage.removeItem('aros-user');
  window.location.href = 'login.html';
}

var OY = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
var now = new Date(new Date().getTime() + 5*60*60*1000);
var curOy = now.getUTCMonth() + 1;
var curYil = now.getUTCFullYear();
// BI-MONTHLY: 2026-06 dan boshlab oy 2 yarimga bo'linadi
// curYarim: 0 = to'liq oy (eski tarix), 1 = 1-15, 2 = 16-oy oxiri
var BIMONTHLY_START_YIL = 2026;
var BIMONTHLY_START_OY = 6;
function isBimonthly(y, m){
  return (y > BIMONTHLY_START_YIL) || (y === BIMONTHLY_START_YIL && m >= BIMONTHLY_START_OY);
}
function defaultYarim(y, m){
  if(!isBimonthly(y, m)) return 0;
  // Joriy oy uchun: bugun<=15 -> 1, else -> 2
  if(y === curYil && m === curOy) return now.getUTCDate() <= 15 ? 1 : 2;
  return 1; // o'tgan bi-monthly oylar uchun default Y1
}
var curYarim = defaultYarim(curYil, curOy);
function getOyNomi(m, y, yarim){
  var base = OY[m-1] + ' ' + y;
  if(!yarim) return base;
  return OY[m-1] + ' ' + yarim + '-yarim ' + y;
}
// BI-MONTHLY: kun display "bugun/oy_kunlari" -> "bugun_yarim/yarim_kunlari" (agar yarim bo'lsa)
function getKunDisplay(f){
  if(f.oy_yarim && f.bugun_yarim && f.yarim_kunlari){
    return (f.bugun_yarim||0)+'/'+f.yarim_kunlari;
  }
  return (f.bugun||0)+'/'+(f.oy_kunlari||30);
}
function getQolganKun(f){
  if(f.oy_yarim && f.bugun_yarim && f.yarim_kunlari){
    return f.yarim_kunlari - (f.bugun_yarim||1);
  }
  return (f.oy_kunlari||30)-(f.bugun||1);
}
function buildYarimSuffix(){
  return curYarim ? '&yarim=' + curYarim : '';
}

// Ikon SVG string qaytaradi. Noma'lum nom -> bo'sh string (xato bermaydi)
function ic(name, size, color, extra){
  var p = (typeof LUCIDE !== 'undefined' && LUCIDE) ? LUCIDE[name] : null;
  if(!p) return '';
  var s = size || 16;
  return '<svg class="lu" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(extra?' style="'+extra+'"':'')+'>'+p+'</svg>';
}

function fmt(n){
  return Math.round(Number(n)||0).toLocaleString('uz-UZ');
}
function fmtFull(n){return Math.round(Number(n)||0).toLocaleString('uz-UZ');}
// Datetime → "DD.MM HH:MM" (yoki "DD.MM.YYYY HH:MM" if showYear)
function fmtDT(dt, showYear){
  if(!dt) return '';
  var s = String(dt);
  var datePart = s.split('T')[0];
  var timePart = '';
  if(s.indexOf('T') !== -1){
    var t = s.split('T')[1];
    timePart = t.substring(0,5);
  }
  var p = datePart.split('-');
  if(p.length === 3){
    var d = p[2]+'.'+p[1] + (showYear ? '.'+p[0] : '');
    return d + (timePart ? ' '+timePart : '');
  }
  return s;
}

function kechikishBadge(t){
  if(!t||!t.is_auto) return '';
  if(!t.kutilgan_yetkazish) return '<span class="tr-auto">AUTO</span>';
  var nowMs=Date.now();
  var deadlineMs=new Date(t.kutilgan_yetkazish).getTime();
  if(isNaN(deadlineMs)) return '<span class="tr-auto">AUTO</span>';
  var diffMs=deadlineMs-nowMs;
  var absMs=Math.abs(diffMs);
  var totalMin=Math.floor(absMs/60000);
  var totalSoat=Math.floor(totalMin/60);
  var kun=Math.floor(totalSoat/24);
  var soat=totalSoat%24;
  var minut=totalMin%60;
  var label;
  if(kun>0){
    label=kun+' kun';
    if(soat>0) label+=' '+soat+' soat';
  } else if(totalSoat>0){
    label=totalSoat+' soat';
    if(minut>0) label+=' '+minut+' min';
  } else {
    label=totalMin+' min';
  }
  var ttl='';
  try{ var dt=new Date(t.kutilgan_yetkazish);
    ttl='Kutilgan: '+String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
  }catch(e){}
  if(diffMs>=0){
    return '<span class="tr-auto">AUTO</span> <span class="kech-ok" title="'+ttl+'">'+ic('hourglass',11)+'+'+label+' bor</span>';
  } else {
    var cls='kech-warn';
    if(totalSoat>=24&&totalSoat<72) cls='kech-bad';
    if(totalSoat>=72) cls='kech-crit';
    return '<span class="tr-auto">AUTO</span> <span class="kechikish-badge '+cls+'" title="'+ttl+'">'+ic('alarm-clock',11)+'-'+label+' kechikdi</span>';
  }
}

function fmtShort(n){
  var v = Number(n)||0;
  if(v===0) return '0';
  var abs = Math.abs(v);
  if(abs>=1000000){
    var m = v/1000000;
    return (m>=10 ? Math.round(m) : Math.round(m*10)/10) + 'M';
  }
  if(abs>=1000){
    var k = v/1000;
    return (k>=10 ? Math.round(k) : Math.round(k*10)/10) + 'K';
  }
  return String(Math.round(v));
}

var MANAGER_WAREHOUSES = {
  all:       null,
  giyosbek:  [61,23,15,5,1,37,17,29],
  sherdil:   [71,13,33,25,35,21,27,100,101,102,103,104]

var curMgr = 'all';

function renderMgrTabs(list){
  var bar = document.getElementById('mgr-tabs');
  if(!bar) return;
  bar.innerHTML = '';
  function mk(key, label){
    var t = document.createElement('div');
    t.className = 'mgr-tab';
    t.textContent = label;
    if(curMgr === key){ t.style.color = 'var(--green)'; t.style.borderBottomColor = 'var(--green)'; }
    t.onclick = function(){ changeMgr(key, t); };
    bar.appendChild(t);
  }
  mk('all', 'Hammasi');
  list.forEach(function(m){ mk('mgr_'+m.id, m.label); });
}

function loadManagers(){
  // Kesh-buster: admin-dev'da filial bo'limga biriktirilgandan keyin brauzer eski
  // ro'yxatni (ETag/keshdan) bermasin — aks holda tab eski taqsimotda qoladi.
  fetch(MANAGERS_API + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){
    var data = Array.isArray(d) ? d[0] : d;
    var list = (data && data.managers) || [];
    if(!list.length){ curMgr = 'all'; renderMgrTabs([]); return; }
    var map = { all: null };
    var labels = {};
    list.forEach(function(m){
      map['mgr_'+m.id] = (m.warehouse_ids || []).map(Number);
      labels['mgr_'+m.id] = m.label;
    });
    MANAGER_WAREHOUSES = map;
    MANAGER_LABELS = labels;
    if(!(curMgr in MANAGER_WAREHOUSES)) curMgr = 'all';
    renderMgrTabs(list);
    if(cachedAllData) renderFromCache();
  }).catch(function(){
    // API javob bermadi: eski QATTIQ yozilgan taqsimotni ko'rsatish = noto'g'ri raqam
    // (admin-dev'dagi o'zgarishlar bu ro'yxatda yo'q). Shuning uchun faqat "Hammasi"
    // qoldiramiz va bir marta qayta urinamiz.
    curMgr = 'all';
    renderMgrTabs([]);
    if(!window._mgrRetry){
      window._mgrRetry = 1;
      setTimeout(loadManagers, 2500);
    }
  });
}

    renderFromCache();

  }
}

function onCeoSearch(val){
  curSearch = val || '';
  clearTimeout(window._ceoSearchTimer);
  window._ceoSearchTimer = setTimeout(function(){
    if(cachedAllData) renderFromCache();
    setTimeout(function(){
      var input = document.getElementById('ceo-search-input');
      if(input){
        input.focus();
        var v = input.value;
        try{ input.setSelectionRange(v.length, v.length); }catch(e){}
      }
    }, 0);
  }, 200);
}

function filterFiliallar(filiallar){
  var wids = MANAGER_WAREHOUSES[curMgr];
  var result = filiallar;
  if(wids){
    result = result.filter(function(f){
      return wids.indexOf(parseInt(f.warehouse_id)) !== -1;
    });
  }
  if(curProfil && curProfil !== 'all'){
    result = result.filter(function(f){
      var p = f.profil || (f.is_franchise ? 'Franshiza' : 'Zapchast');
      return p === curProfil;
    });
  }
  // Search filter
  var q = (curSearch||'').toLowerCase().trim();
  if(q){
    result = result.filter(function(f){
      return (f.filial||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  return result;
}

function renderFromCache(){

setInterval(function(){
  var bars = document.querySelectorAll('[id^="dl-cnt-"]');
  bars.forEach(function(el){
    var userId = el.id.replace('dl-cnt-','');
    var bar = document.getElementById('dl-bar-'+userId);
    if(!bar) return;
    var dlTime = new Date(bar.getAttribute('data-dl')).getTime();
    var now = new Date().getTime();
    var diff = dlTime - now;
    var expired = diff < 0;
    var abs = Math.abs(diff);
    var days = Math.floor(abs/86400000);
    var h = Math.floor((abs%86400000)/3600000);
    var m = Math.floor((abs%3600000)/60000);
    var s = Math.floor((abs%60000)/1000);
    // Ikon SVG — textContent SVG'ni render qilmaydi, shuning uchun innerHTML
    el.innerHTML = (expired?ic('alert-triangle',12,'#fff','margin-right:4px')+'-':'')+(days>0?days+'k ':'')+h+'s '+m+'d '+s+'s';
    bar.style.background = expired ? '#aa0022' : 'var(--red)';
  });
}, 1000);

function buildOyOptions(){
  var sel=document.getElementById('oy-select');
  sel.innerHTML='';
  for(var y=2026;y<=curYil;y++){
    var endM=y===curYil?curOy:12;
    for(var m=1;m<=endM;m++){
      if(isBimonthly(y, m)){
        // Bi-monthly oy — 2 ta yarim entry
        // Joriy oy uchun faqat hozirgi va o'tgan yarimni ko'rsatish
        var maxYarim = (y === curYil && m === curOy) ? defaultYarim(y, m) : 2;
        for(var yr=1; yr<=maxYarim; yr++){
          var opt=document.createElement('option');
          opt.value=y+'-'+m+'-'+yr;
          opt.textContent=OY[m-1]+' '+yr+'-yarim '+y;
          if(y===curYil && m===curOy && yr===curYarim) opt.selected=true;
          sel.appendChild(opt);
        }
      } else {
        // Eski (bi-monthly oldidan) — to'liq oy
        var opt=document.createElement('option');
        opt.value=y+'-'+m+'-0';
        opt.textContent=OY[m-1]+' '+y;
        sel.appendChild(opt);
      }
    }
  }
}

function updateJami(filialData){

function fetchFilial(wid,filialNomi,plan,oy,idx,allData){
  fetch(FILIAL_API+'?wid='+wid+'&oy='+curOy+'&yil='+curYil+buildYarimSuffix()).then(function(r){return r.text();}).then(function(txt){
    var fd=parseSafe(txt);
    if(fd&&fd.plan!==undefined){
      fd.filial=fd.filial||filialNomi;
      fd.warehouse_id=String(wid);
      fd.muddati_utgan=fd.summary?fd.summary.muddati_utgan:0;
      allData[idx]=fd;
    } else {
      allData[idx]={filial:filialNomi,warehouse_id:String(wid),oy:oy,plan:plan,orders_summa:0,returns_summa:0,
        bajarildi:0,foiz:0,qoldi:plan,prognoz:0,prognoz_foiz:0,bugun:now.getDate(),
        oy_kunlari:new Date(curYil,curOy,0).getDate(),muddati_utgan:0,
        tugallanmagan_savdo:0,tugallanmagan_savdo_son:0};
    }
    renderCard(allData[idx],idx);
    updateJami(allData);
    if(curMgr==='all'){
      var loaded=allData.filter(function(x){return x&&x.foiz!==undefined;});
      if(loaded.length===allData.length){
        cachedAllData=allData.slice();
        cachedOy=curOy;
        cachedYil=curYil;
      }
    }
  }).catch(function(){
    allData[idx]={filial:filialNomi,warehouse_id:String(wid),plan:plan,bajarildi:0,foiz:0,qoldi:plan,
      orders_summa:0,returns_summa:0,prognoz_foiz:0,bugun:1,oy_kunlari:30,muddati_utgan:0,
      tugallanmagan_savdo:0,tugallanmagan_savdo_son:0};
    renderCard(allData[idx],idx);
  });
}

function loadDetDeadlines(cb){
  if(!detFilial) { if(cb) cb(); return; }
  fetch(DEADLINE_API+'?warehouse_id='+detFilial.warehouse_id)
    .then(function(r){return r.json();})
    .then(function(data){
      var d = Array.isArray(data)?data[0]:data;
      var list = d.deadlines || [];
      detDeadlines = {};
      list.forEach(function(dl){ detDeadlines[String(dl.user_id)] = dl; });
      if(cb) cb();
    })
    .catch(function(){ if(cb) cb(); });
}

function saveDlModal(){
  var userId = document.getElementById('dl-user-id').value;
  var qarzSumma = parseFloat(document.getElementById('dl-qarz-summa').value)||0;
  var dlAll = document.getElementById('dl-all').checked;
  var dlDate = document.getElementById('dl-date').value;
  var dlTime = document.getElementById('dl-time').value;
  if(!dlDate||!dlTime){ alert("Sana va vaqtni kiriting"); return; }
  var deadlineStr = dlDate+'T'+dlTime+':00';
  var now = new Date(new Date().getTime()+5*60*60*1000).toISOString();
  var debtor = detUsers.find(function(u){return String(u.user_id)===String(userId);});
  var ism = debtor ? debtor.ism : '';
  var body = {
    mijoz: ism,
    user_id: String(userId),
    filial: detFilial.filial,
    warehouse_id: String(detFilial.warehouse_id),
    umumiy_qarz: String(debtor ? (debtor.otgan_summa||debtor.summa) : qarzSumma),
    deadline_summa: dlAll ? String(debtor ? debtor.summa : qarzSumma) : String(qarzSumma),
    quyilgan_deadline: deadlineStr,
    qoygan_vaqt: now,
    status: 'active',
    ceo_id: String(uid)
  };
  var params = new URLSearchParams(body).toString();
  fetch(DEADLINE_SET+'?'+params, { method:'GET' })
    .then(function(r){ return r.text(); })
    .then(function(){ 
      closeDlModal();
      detDeadlines[String(userId)] = body;
      if(detOtgan.length) renderDetList('det-otgan',detOtgan,'var(--red)','b-red',"Muddati o'tgan qarz yo'q!",true);
    })
    .catch(function(e){ alert('Xato: '+e.message); });
}

function okDeadline(userId){
  var body = { user_id: String(userId), warehouse_id: String(detFilial.warehouse_id) };

}

function loadDetTab(tab){
  if(!detUsers.length){
    document.getElementById('det-'+tab).innerHTML='<div class="empty"><div class="et">Qarz yo\'q</div></div>';
    return;
  }
  var resMap={},done=0,total=detUsers.length;
  function check(){
    done++;
    if(done<total) return;
    var final=Object.values(resMap);
    if(tab==='otgan'){
      detOtgan=final;
      renderDetList('det-otgan',final,'var(--red)','b-red','Muddati o\'tgan qarz yo\'q!',true);
      var otS=final.reduce(function(s,r){return s+Number(r.summa||0);},0);
      var el=document.getElementById('det-ots');
      var elS=document.getElementById('det-ots-son');
      if(el) el.textContent=fmt(otS);
      if(elS) elS.textContent=final.length+' ta';
    } else if(tab==='bugun'){
      detBugun=final;
      renderDetList('det-bugun',final,'var(--red)','b-red','Bugun to\'lanadigan qarz yo\'q',false);
    } else {
      detErtaga=final;
      renderDetList('det-ertaga',final,'var(--amber)','b-amber','Ertaga to\'lanadigan qarz yo\'q',false);
    }
  }
  detUsers.forEach(function(debtor){
    if(detOrders[debtor.user_id]!==undefined){
      procDet(debtor,detOrders[debtor.user_id],tab,resMap);check();return;
    }
    fetch(ORDERS_API+'?user_id='+debtor.user_id)
      .then(function(r){return r.json();})
      .then(function(data){
        var d=Array.isArray(data)?data[0]:data;
        detOrders[debtor.user_id]=d.orders||[];
        procDet(debtor,detOrders[debtor.user_id],tab,resMap);check();
      })
      .catch(function(){check();});
  });
}

function procDet(debtor,orders,tab,resMap){
  var filtered;
  if(tab==='otgan') filtered=orders.filter(function(o){return o.deadline&&o.deadline<bugunStr;});
  else if(tab==='bugun') filtered=orders.filter(function(o){return o.deadline===bugunStr;});
  else filtered=orders.filter(function(o){return o.deadline===ertagaStr;});
  if(!filtered.length) return;
  var tot=filtered.reduce(function(s,o){return s+Number(o.summa||0);},0);
  var wallet=Number(debtor.wallet_balance)||0;
  var net=Math.max(0,tot-wallet);
  if(net===0) return;
  resMap[debtor.user_id]={ism:debtor.ism,telefon:debtor.telefon,summa:net,otgan_summa:debtor.otgan_summa||0,wallet_balance:wallet,user_id:debtor.user_id,orders:filtered,usertype:debtor.usertype||''};
}

    if(hasDl){
      var dlMs = new Date(dl.quyilgan_deadline).getTime()-new Date().getTime();
      var dlExpired = dlMs < 0;
      var absDl = Math.abs(dlMs);
      var dlDays = Math.floor(absDl/86400000);

    }

function showConfirmedModal(){
  if(!detFilialCache) return;
  var orders=(detFilialCache.confirmedOrders||[]).slice();
  if(!orders.length){alert("Ochiq buyurtma yo'q");return;}
  var nowUZB = new Date(new Date().getTime() + 5*60*60*1000);
  var bugunStr = nowUZB.toISOString().split('T')[0];
  function kunHisob(dateStr) {
    if (!dateStr) return 0;
    var d = new Date(dateStr.split('T')[0]);
    var today = new Date(bugunStr);
    return Math.floor((today - d) / 86400000);
  }
  function fmtDateTime(dt) {
    if (!dt) return '';
    var s = String(dt);
    var datePart = s.split('T')[0];
    var timePart = '';
    if (s.indexOf('T') !== -1) {
      var t = s.split('T')[1];
      timePart = t.substring(0,5);
    }
    var parts = datePart.split('-');
    if (parts.length === 3) {
      return parts[2]+'.'+parts[1]+'.'+parts[0]+(timePart ? ' '+timePart : '');
    }
    return s;
  }
  orders.forEach(function(o){ o._kun = kunHisob(o.created_datetime || o.sana); });
  orders.sort(function(a,b){ return (b._kun||0) - (a._kun||0); });
  var html='<div style="padding:12px 16px 24px">';
  html+='<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Ochiq buyurtmalar ('+orders.length+' ta)</div>';
  orders.forEach(function(o){
    var url='https://admin.aros.uz/orders/'+o.order_id+'/';
    var kun = o._kun || 0;
    var kunBadge = kun>0 ? '<span style="font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-xs);background:var(--tint-red);border:0.5px solid var(--tint-red-b);color:var(--red);margin-left:6px;flex-shrink:0">'+kun+' kun</span>' : '';
    var dtStr = fmtDateTime(o.created_datetime || o.sana);
    html+='<a href="'+url+'" style="display:block;text-decoration:none;color:inherit;margin-bottom:8px">';
    html+='<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--r-md);padding:10px 12px;min-height:56px;display:flex;gap:8px;justify-content:space-between;align-items:center">';
    html+='<div style="flex:1;min-width:0">';
    html+='<div style="display:flex;align-items:center;flex-wrap:wrap"><div style="font-size:13px;font-weight:700;letter-spacing:-.1px">'+(o.ism||"Noma\'lum")+'</div>'+kunBadge+'</div>';
    html+='<div style="font-size:11px;color:var(--text3);margin-top:3px">Order #'+o.order_id+' · '+dtStr+'</div></div>';
    html+='<div style="font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--green);flex-shrink:0;font-variant-numeric:tabular-nums">'+fmtFull(o.summa)+' so\'m</div>';
    html+='</div></a>';
  });
  html+='</div>';
  document.getElementById('det-ochiq-content').innerHTML=html;
  document.getElementById('det-ochiq-modal').style.display='flex';
}

function dashReturnsFor(w, oy, yil, yarim){
  try{
    if(Number(yarim||0) !== Number(curYarim||0)) return null;
    var arr = (typeof cachedAllData !== 'undefined' && cachedAllData) ? cachedAllData : [];
    for(var i=0;i<arr.length;i++){
      if(String(arr[i].warehouse_id) === String(w)){
        if(Number(oy) !== Number(curOy) || Number(yil) !== Number(curYil)) return null;
        var v = Number(arr[i].returns_summa);
        return isNaN(v) ? null : v;
      }
    }
  }catch(e){}
  return null;
}
function openCalendar(wid, filialNomi, oy, yil, yarim){
  var modal = document.getElementById('cal-modal');
  var title = document.getElementById('cal-title');
  var subtitle = document.getElementById('cal-subtitle');
  var body = document.getElementById('cal-body');
  var yarimNum = (yarim !== undefined && yarim !== null) ? parseInt(yarim) : curYarim;
  // Ikon alohida statik elementda (#cal-title-ic) — textContent SVG'ni render qilmaydi
  title.textContent = (filialNomi||'Kalendar');
  subtitle.textContent = getOyNomi(parseInt(oy), parseInt(yil), yarimNum);
  body.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text3)"><div style="display:inline-block;width:28px;height:28px;border:3px solid var(--bg3);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite"></div><div style="margin-top:10px;font-size:12px">Yuklanmoqda...</div></div>';
  modal.style.display = 'flex';
  var calUrl = CALENDAR_API+'?wid='+wid+'&oy='+oy+'&yil='+yil + (yarimNum ? '&yarim='+yarimNum : '');
  fetch(calUrl)
    .then(function(r){return r.text();})
    .then(function(txt){
      var d; try{ var raw=JSON.parse(txt); d=Array.isArray(raw)?raw[0]:raw; }catch(e){ d=null; }
      if(!d || !d.days){ body.innerHTML='<div style="text-align:center;padding:30px;color:var(--red)">Ma\'lumot yuklanmadi</div>'; return; }
      renderCalendar(d);
    })
    .catch(function(e){ body.innerHTML='<div style="text-align:center;padding:30px;color:var(--red)">Xato: '+e.message+'</div>'; });
}

function renderCalendar(d){
  var body = document.getElementById('cal-body');
  var days = d.days||[];
  var oy = d.oy, yil = d.yil;
  var oyKunlari = d.oy_kunlari || 30;
  var ishKunlari = d.ish_kunlari || oyKunlari;
  var kunlikPlan = d.kunlik_plan || 0;
  var dayOffs = d.day_offs || [];
  var dayOffMap = {};
  dayOffs.forEach(function(x){ dayOffMap[x.kun] = (x.reason||'bayram').toLowerCase(); });
  var firstDay = new Date(yil, oy-1, 1).getDay();
  var offset = firstDay === 0 ? 6 : firstDay - 1;
  var dayMap = {};
  days.forEach(function(day){ dayMap[day.kun] = day; });
  // --- Yarimlik (davr) chegarasi ---
  // MUHIM: API yarimlik so'ralganda ham OYNING BARCHA kunlarini qaytaradi,
  // yarimlikdan tashqari kunlar status='outofyarim', in_yarim=false bo'ladi.
  // Statistika faqat joriy yarimlik kunlari bo'yicha hisoblanishi shart.
  var yarimNo = parseInt(d.oy_yarim) || 0;
  var yStart = parseInt(d.yarim_start_kun) || 1;
  var yEnd = parseInt(d.yarim_end_kun) || oyKunlari;
  var yarimMode = !!(yarimNo && d.yarim_start_kun);
  function inDavr(x){
    if(!yarimMode) return true;
    if(x && typeof x.in_yarim === 'boolean') return x.in_yarim;
    var kn = x && x.kun != null ? parseInt(x.kun) : parseInt(x);
    return kn >= yStart && kn <= yEnd;
  }
  var davrDays = days.filter(inDavr);
  // Statistika (faqat joriy davr + faqat ish kunlari)
  var totalBaj = davrDays.reduce(function(s,x){return x.is_day_off ? s : s+(x.bajarilgan||0);},0);
  var greenCount = davrDays.filter(function(x){return x.status==='green';}).length;
  var amberCount = davrDays.filter(function(x){return x.status==='amber';}).length;
  var redCount = davrDays.filter(function(x){return x.status==='red';}).length;
  var dayOffCount = Object.keys(dayOffMap).filter(function(k){return inDavr(k);}).length;
  // Davr plani (yarimlikda d.plan — yarimlik plani, aks holda oylik plan)
  var davrPlan = parseInt(d.plan) || (kunlikPlan * ishKunlari) || 0;
  var davrFoiz = davrPlan > 0 ? Math.round(totalBaj / davrPlan * 100) : 0;
  var davrLabel = yarimMode ? (yStart + '–' + yEnd + ' · ' + yarimNo + '-yarim') : '1–' + oyKunlari;
  // Davr ichida bugungacha o'tgan ish kunlari (kelajak kunlarni API qaytarmaydi)
  var otganIshKun = davrDays.filter(function(x){return !x.is_day_off;}).length;
  var kutilganFoiz = ishKunlari > 0 ? Math.round(otganIshKun / ishKunlari * 100) : 0;
  // Rang umumiy planga emas, SUR'ATGA qarab beriladi — aks holda davr boshida qizil chiqadi
  var surat = kutilganFoiz > 0 ? (davrFoiz / kutilganFoiz) : 0;
  var davrColor = otganIshKun === 0 ? 'var(--text2)'
    : surat >= 0.95 ? 'var(--green)' : surat >= 0.8 ? 'var(--amber)' : 'var(--red)';

  function dayOffIcon(reason, size){
    return reason === 'inventory' ? ic('bar-chart-3',size||13,'var(--text2)') : ic('gift',size||13,'var(--text2)');
  }

  var html = '';
  html += '<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:14px">';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-variant-numeric:tabular-nums">';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:4px">Kunlik plan</div><div style="font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--text)">'+fmt(kunlikPlan)+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">'+ishKunlari+' ish kuni</div></div>';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:4px">Bajarilgan · '+davrLabel+'</div><div style="font-size:15px;font-weight:800;letter-spacing:-.3px;color:'+davrColor+'">'+fmt(totalBaj)+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">'+davrFoiz+'% · kutilgan '+kutilganFoiz+'%'+'</div></div>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums">';
  html += '<div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--green)">'+greenCount+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">Yaxshi</div></div>';
  html += '<div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--amber)">'+amberCount+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">O\'rtacha</div></div>';
  html += '<div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--red)">'+redCount+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">Past</div></div>';
  if(dayOffCount > 0){
    html += '<div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--text2)">'+dayOffCount+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">Dam</div></div>';
  }
  html += '</div></div>';
  // Vozvrat manbalari nomuvofiqligi — raqamni yashirmaymiz, ogohlantiramiz
  var calRet = davrDays.reduce(function(s,x){return s+(x.qaytarilgan||0);},0);
  var dashRet = dashReturnsFor(d.warehouse_id, d.oy, d.yil, d.oy_yarim);
  if(dashRet !== null && dashRet > 0 && calRet < dashRet * 0.9){
    html += '<div style="display:flex;align-items:flex-start;gap:8px;background:var(--tint-amber);border:1px solid var(--tint-amber-b);border-radius:var(--r-md);padding:10px 12px;margin-bottom:14px">';
    html += '<div style="display:flex;flex-shrink:0;padding-top:1px">'+ic('alert-triangle',15,'var(--amber)')+'</div><div>';
    html += '<div style="font-size:12px;font-weight:700;color:var(--amber)">Vozvrat ma\'lumoti to\'liq emas</div>';
    html += '<div style="font-size:11px;color:var(--text2);margin-top:3px;line-height:1.35">Kalendar: '+fmt(calRet)+' \u00b7 Dashboard: '+fmt(dashRet)+'</div>';
    html += '<div style="font-size:11px;color:var(--text2);margin-top:2px;line-height:1.35">Kunlik vozvrat raqamlariga tayanmang \u2014 dashboarddagi summa to\'g\'ri.</div>';
    html += '</div></div>';
  }
  var haftaKunlari = ['Du','Se','Ch','Pa','Ju','Sh','Ya'];
  html += '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px;width:100%">';
  haftaKunlari.forEach(function(h){
    html += '<div style="text-align:center;font-size:11px;color:var(--text3);font-weight:600;padding:4px 0">'+h+'</div>';
  });
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%;font-variant-numeric:tabular-nums" id="cal-grid">';
  for(var i=0;i<offset;i++){ html += '<div></div>'; }
  for(var k=1;k<=oyKunlari;k++){
    var isDayOff = !!dayOffMap[k];
    var reason = dayOffMap[k] || '';
    var dayData = dayMap[k];
    if(isDayOff){
      var icon = dayOffIcon(reason,13);
      var bg = 'var(--tint-neutral)';
      var txtColor = 'var(--text2)';
      html += '<div onclick="showDayDetail('+k+')" id="cd-'+k+'" role="button" tabindex="0" style="position:relative;aspect-ratio:1;background:'+bg+';border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px dashed var(--border);transition:border-color .15s;min-width:0;overflow:hidden">';
      html += '<div style="font-size:13px;font-weight:700;color:'+txtColor+';line-height:1">'+k+'</div>';
      html += '<div style="display:flex;line-height:1">'+icon+'</div>';
      html += '</div>';
    } else if(dayData){
      var bg, txtColor, outOf = (dayData.status==='outofyarim') || !inDavr(dayData);
      if(outOf){ bg='var(--bg3)'; txtColor='var(--text3)'; }
      else if(dayData.status==='green'){ bg='var(--tint-green)'; txtColor='var(--green)'; }
      else if(dayData.status==='amber'){ bg='var(--tint-amber)'; txtColor='var(--amber)'; }
      else{ bg='var(--tint-red)'; txtColor='var(--red)'; }
      html += '<div onclick="showDayDetail('+k+')" id="cd-'+k+'" role="button" tabindex="0" style="position:relative;aspect-ratio:1;background:'+bg+';border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px solid transparent;transition:border-color .15s;min-width:0;overflow:hidden" onmouseover="this.style.borderColor=\''+txtColor+'\'" onmouseout="this.style.borderColor=\'transparent\'">';
      html += '<div style="font-size:14px;font-weight:700;color:'+txtColor+';line-height:1">'+k+'</div>';
      html += '<div style="font-size:11px;color:'+txtColor+';opacity:.85;line-height:1">'+(outOf?'·':(dayData.foiz||0)+'%')+'</div>';
      html += '</div>';
    } else {
      html += '<div style="position:relative;aspect-ratio:1;background:var(--bg3);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;opacity:.4;min-width:0;overflow:hidden"><div style="font-size:13px;color:var(--text3)">'+k+'</div></div>';
    }
  }
  html += '</div>';
  html += '<div style="display:flex;justify-content:center;gap:10px;margin-top:14px;font-size:11px;color:var(--text3);flex-wrap:wrap">';
  html += '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:var(--tint-green-b)"></div>100%+</div>';
  html += '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:var(--tint-amber-b)"></div>70-99%</div>';
  html += '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:var(--tint-red-b)"></div>&lt;70%</div>';
  html += '<div style="display:flex;align-items:center;gap:4px">'+ic('gift',12)+'Bayram</div>';
  html += '<div style="display:flex;align-items:center;gap:4px">'+ic('package',12)+'MML A</div>';
  html += '</div>';
  html += '<div id="cal-day-detail" style="margin-top:14px"></div>';

  body.innerHTML = html;
  window._calDays = dayMap;
  window._calKunlikPlan = kunlikPlan;
  window._calDayOffs = dayOffMap;
  window._calWid = d.warehouse_id;
  window._calOy = oy;
  window._calYil = yil;
  window._calOyKunlari = oyKunlari;
  loadAndApplyMmlBadges(d.warehouse_id, oy, yil, oyKunlari);
}

// MML badge loader - har kun cell'ga X/Y indikator nuqta qo'shadi
function loadAndApplyMmlBadges(wid, oy, yil, oyKunlari){
  if(!wid) return;
  fetch(MML_HISTORY_API+'?wid='+wid+'&oy='+oy+'&yil='+yil)
    .then(function(r){return r.text();})
    .then(function(txt){
      var d; try{ var raw=JSON.parse(txt); d=Array.isArray(raw)?raw[0]:raw; }catch(e){ d=null; }
      if(!d || !d.days) return;
      window._calMmlDays = d.days;
      for(var k=1;k<=oyKunlari;k++){
        var mml = d.days[k];
        if(!mml || !mml.total_a) continue;
        var cell = document.getElementById('cd-'+k);
        if(!cell) continue;
        var foiz = mml.total_a > 0 ? Math.round(mml.mavjud_a / mml.total_a * 100) : 0;
        var badgeColor, badgeBg;
        if(foiz >= 100){ badgeColor='var(--green)'; badgeBg='var(--tint-green-b)'; }
        else if(foiz >= 90){ badgeColor='var(--amber)'; badgeBg='var(--tint-amber-b)'; }
        else { badgeColor='var(--red)'; badgeBg='var(--tint-red-b)'; }
        // MML indikator - kichik rangli nuqta cell'ning yuqori-o'ng burchagida
        var badge = document.createElement('div');
        badge.style.cssText = 'position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:'+badgeColor+';box-shadow:0 0 0 1.5px '+badgeBg+';pointer-events:none';
        badge.title = 'MML A: '+mml.mavjud_a+'/'+mml.total_a+' ('+foiz+'%)';
        cell.appendChild(badge);
      }
    })
    .catch(function(e){ console.warn('MML badges load error:', e); });
}

function showDayDetail(kun){
  var d = (window._calDays||{})[kun];
  var kp = window._calKunlikPlan || 0;
  var dayOffMap = window._calDayOffs || {};
  var isDayOff = !!dayOffMap[kun];
  var el = document.getElementById('cal-day-detail');
  if(!el) return;
  
  if(isDayOff){
    var reason = dayOffMap[kun];
    var icon = reason === 'inventory' ? ic('bar-chart-3',18,'var(--text2)') : ic('gift',18,'var(--text2)');
    var label = reason === 'inventory' ? 'Inventory kuni' : 'Bayram kuni';
    var html = '<div style="background:var(--bg3);border-radius:var(--r-lg);padding:14px;border:1px dashed var(--border)">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
    html += '<div style="font-size:14px;font-weight:700;letter-spacing:-.2px">'+kun+'-kun</div>';
    html += '<div style="display:flex">'+icon+'</div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text2);text-align:center;padding:8px 0">'+label+' — ish kuni emas</div>';
    html += '</div>';
    el.innerHTML = html;
    el.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  
  if(!d) return;
  var outOf = (d.status==='outofyarim') || (d.in_yarim === false);
  var color = outOf?'var(--text3)':d.status==='green'?'var(--green)':d.status==='amber'?'var(--amber)':'var(--red)';
  var tintBd = outOf?'var(--border)':d.status==='green'?'var(--tint-green-b)':d.status==='amber'?'var(--tint-amber-b)':'var(--tint-red-b)';
  var html = '<div style="background:var(--bg3);border-radius:var(--r-lg);padding:14px;border:1px solid '+tintBd+'">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px">';
  html += '<div style="font-size:14px;font-weight:700;letter-spacing:-.2px">'+kun+'-kun · '+d.sana+'</div>';
  html += outOf
    ? '<div style="font-size:11px;font-weight:700;color:var(--text3);background:var(--bg2);padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0">boshqa yarimlik</div>'
    : '<div style="font-size:18px;font-weight:800;letter-spacing:-.5px;flex-shrink:0;font-variant-numeric:tabular-nums;color:'+color+'">'+(d.foiz||0)+'%</div>';
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-variant-numeric:tabular-nums">';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:3px">Tushum</div><div style="font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--green)">'+fmt(d.tushum||0)+'</div></div>';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:3px">Qaytarilgan</div><div style="font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--red)">-'+fmt(d.qaytarilgan||0)+'</div></div>';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:3px">Bajarilgan</div><div style="font-size:14px;font-weight:800;letter-spacing:-.2px;color:'+color+'">'+fmt(d.bajarilgan||0)+'</div></div>';
  html += '<div style="min-width:0"><div style="color:var(--text2);font-size:11px;font-weight:600;letter-spacing:-.1px;margin-bottom:3px">Kunlik plan</div><div style="font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--text2)">'+fmt(kp)+'</div></div>';
  html += '</div>';
  // MML A toifa qismi
  var mml = (window._calMmlDays||{})[kun];
  if(mml && mml.total_a){
    var mmlFoiz = mml.total_a > 0 ? Math.round(mml.mavjud_a / mml.total_a * 100) : 0;
    var mmlColor = mmlFoiz>=100?'var(--green)':mmlFoiz>=90?'var(--amber)':'var(--red)';
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">';
    html += '<div style="font-size:11px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:5px">'+ic('package',13)+'A toifa MML</div>';
    html += '<div style="font-size:13px;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:'+mmlColor+'">'+mml.mavjud_a+' / '+mml.total_a+' ('+mmlFoiz+'%)</div>';
    html += '</div>';
    if(mml.yetishmovchi_a > 0){
      html += '<div onclick="loadMissingList('+(window._calWid||0)+',\''+(mml.sana||d.sana)+'\')" role="button" tabindex="0" style="background:var(--tint-red);border:1px solid var(--tint-red-b);border-radius:var(--r-sm);padding:8px 10px;min-height:40px;cursor:pointer;display:flex;gap:8px;justify-content:space-between;align-items:center">';
      html += '<span style="font-size:11px;color:var(--red);font-weight:700;display:flex;align-items:center;gap:5px">'+ic('x-circle',13)+mml.yetishmovchi_a+' yetishmovchi</span>';
      html += '<span style="font-size:11px;color:var(--red);display:flex;align-items:center;gap:4px">'+ic('clipboard-list',13)+'Ro\'yxat + Excel'+ic('chevron-right',12)+'</span>';
      html += '</div>';
    } else {
      html += '<div style="background:var(--tint-green);border:1px solid var(--tint-green-b);border-radius:var(--r-sm);padding:8px 10px;font-size:11px;color:var(--green);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600">'+ic('check-circle-2',13)+'Barcha A toifa to\'liq</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

          '<div style="min-width:0"><div id="mml-modal-title" style="font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Yetishmovchi A toifa</div>'+
          '<div id="mml-modal-subtitle" style="font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>'+

// Excel/CSV download
function downloadMmlExcel(){
  var data = window._mmlExcelData;
  if(!data || !data.products || !data.products.length){ return; }
  // sep=, directive Excel uchun (rus/uzb lokalda comma'ni separator qiladi)
  // \uFEFF BOM utf-8 uchun
  var csv = '\uFEFF' + 'sep=,\n';
  csv += 'No,ID,Mahsulot nomi,Kategoriya,Sifat,Rang\n';
  data.products.forEach(function(p, i){
    var nomi = String(p.nomi||'').replace(/"/g,'""');
    var kategoriya = String(p.kategoriya||'').replace(/"/g,'""');
    var sifat = String(p.sifat||'').replace(/"/g,'""');
    var rang = String(p.rang||'').replace(/"/g,'""');
    csv += (i+1)+','+p.id+',"'+nomi+'","'+kategoriya+'","'+sifat+'","'+rang+'"\n';
  });
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'MML_yetishmovchi_'+(data.filial||'filial').replace(/[^a-zA-Z0-9]/g,'_')+'_'+data.sana+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
}

// ============ MULTI-SHEET MML DOWNLOAD ============
var _mmlDlBusy = false;

function downloadMmlBatch(){
  if(_mmlDlBusy) return;
  if(typeof XLSX === 'undefined'){
    alert('Excel kutubxonasi yuklanmagan. Sahifani qayta yuklang.');
    return;
  }
  // Filtrlangan filiallar (curMgr, curProfil, curSearch'ga binoan)
  var filiallar = filterFiliallar(cachedAllData || []);
  if(!filiallar || filiallar.length === 0){
    alert('Tanlangan filterda filial topilmadi');
    return;
  }
  _mmlDlBusy = true;
  var btn = document.getElementById('mml-dl-btn');
  var txt = document.getElementById('mml-dl-text');
  var icEl = document.getElementById('mml-dl-ic');
  // Ikon alohida span'da — matn textContent bilan, ikon innerHTML bilan yangilanadi
  function setDlIcon(name){ if(icEl) icEl.innerHTML = ic(name,16,'#fff'); }
  if(btn){ btn.style.opacity = '0.75'; btn.style.cursor = 'wait'; btn.disabled = true; }

  var total = filiallar.length;
  var completed = 0;
  var errors = 0;
  var sheets = []; // {name, rows, filial, sana, total_a, mavjud_a}

  function updateProgress(){
    var pct = Math.round(completed / total * 100);
    if(txt) txt.textContent = 'Yuklanmoqda... '+pct+'% ('+completed+'/'+total+')';
  }

  function finalize(){
    if(sheets.length === 0){
      setDlIcon('alert-triangle');
      if(txt) txt.textContent = 'Hech qanday ma\'lumot topilmadi';
      setTimeout(resetBtn, 2000);
      return;
    }
    if(txt) txt.textContent = 'Excel yaratilmoqda...';
    try {
      var wb = XLSX.utils.book_new();
      // Filial nomi bo'yicha alfavit tartib
      sheets.sort(function(a,b){ return (a.filial||'').localeCompare(b.filial||''); });
      sheets.forEach(function(s){
        var ws = XLSX.utils.json_to_sheet(s.rows);
        // Ustun kengligi
        ws['!cols'] = [
          {wch: 5},   // No
          {wch: 8},   // ID
          {wch: 50},  // Mahsulot nomi
          {wch: 28},  // Kategoriya
          {wch: 14},  // Sifat
          {wch: 14},  // Rang
          {wch: 10}   // Oxirgi miqdor
        ];
        // Sheet nomi (Excel max 31 char, ba'zi belgilar yo'q)
        var sheetName = (s.filial||'Filial').replace(/[\\/?*\[\]:]/g,' ').substring(0,31);
        // Dublikat oldini olish
        var origName = sheetName;
        var dup = 2;
        while(wb.SheetNames.indexOf(sheetName) !== -1){
          sheetName = origName.substring(0, 28)+'_'+dup;
          dup++;
        }
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });
      var sana = new Date().toISOString().split('T')[0];
      var filterLabel = '';
      if(curMgr !== 'all') filterLabel += '_'+(MANAGER_LABELS[curMgr] || curMgr);
      if(curProfil && curProfil !== 'all') filterLabel += '_'+curProfil;
      var filename = 'MML_yetishmovchi'+filterLabel+'_'+sana+'.xlsx';
      XLSX.writeFile(wb, filename);
      setDlIcon('check');
      if(txt) txt.textContent = 'Yuklab olindi · '+sheets.length+' filial'+(errors>0?' ('+errors+' xato)':'');
    } catch(e){
      console.error('Excel yaratishda xato:', e);
      setDlIcon('x');
      if(txt) txt.textContent = 'Xato: '+e.message;
    }
    setTimeout(resetBtn, 3000);
  }

  function resetBtn(){
    _mmlDlBusy = false;
    if(btn){ btn.style.opacity = '1'; btn.style.cursor = 'pointer'; btn.disabled = false; }
    setDlIcon('download');
    if(txt) txt.textContent = 'MML yetishmovchi tovarlarni yuklash';
  }

  // Parallel batch — 5 ta filial bir vaqtning o'zida
  var idx = 0;
  var BATCH = 5;
  var active = 0;

  function fetchOne(filial){
    var wid = filial.warehouse_id;
    return fetch(MML_CHECK_API+'?wid='+wid+'&_='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && !d.error && d.missing_products && d.missing_products.length > 0){
          var rows = d.missing_products.map(function(p, i){
            return {
              'No': i + 1,
              'ID': p.id || '',
              'Mahsulot nomi': p.nomi || p.mahsulot_nomi || p.name || '',
              'Kategoriya': p.kategoriya || p.category || '',
              'Sifat': p.sifat || p.quality || '',
              'Rang': p.rang || p.color || '',
              'Oxirgi miqdor': p.oxirgi_miqdori != null ? p.oxirgi_miqdori : ''
            };
          });
          sheets.push({
            filial: filial.filial || d.filial_nomi || filial.warehouse_name || ('Filial-'+wid),
            rows: rows,
            sana: d.sana,
            total_a: d.total_a,
            mavjud_a: d.mavjud_a
          });
        }
      })
      .catch(function(e){
        console.warn('MML fetch xato wid='+wid+':', e);
        errors++;
      })
      .then(function(){
        completed++;
        active--;
        updateProgress();
        next();
      });
  }

  function next(){
    while(active < BATCH && idx < filiallar.length){
      active++;
      fetchOne(filiallar[idx]);
      idx++;
    }
    if(idx >= filiallar.length && active === 0){
      finalize();
    }
  }

  updateProgress();
  next();
}

function showTransfersModal(transfers, filialNomi, brakTransfers){
  var modal=document.getElementById('tr-modal');
  var list=document.getElementById('tr-list');
  var subtitle=document.getElementById('tr-subtitle');
  var all=(transfers||[]).slice();

  _trModalData.aktiv=all.filter(function(t){return t.status==='created'||t.status==='on_way';})
    .sort(function(a,b){
      if(a.status!==b.status){
        if(a.status==='on_way') return -1;
        if(b.status==='on_way') return 1;
        return 0;
      }
      return (b.kun_otgan||0)-(a.kun_otgan||0);
    });
  _trModalData.bekor=all.filter(function(t){return t.status==='returned';})
    .sort(function(a,b){return (b.kun_otgan||0)-(a.kun_otgan||0);});
  _trModalData.brak=(brakTransfers||[]).slice()
    .sort(function(a,b){
      if(a.status!==b.status){
        if(a.status==='on_way') return -1;
        if(b.status==='on_way') return 1;
        if(a.status==='created') return -1;
        if(b.status==='created') return 1;
        return 0;
      }
      return (b.kun_otgan||0)-(a.kun_otgan||0);
    });

  subtitle.textContent=(filialNomi||'')+' · '+all.length+' ta';

    tabsHtml+='<div style="font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--text);line-height:1.15;font-variant-numeric:tabular-nums">'+tb.cnt+'</div>';
    tabsHtml+='<div class="tr-tab-lbl" style="font-size:11px;font-weight:700;color:var(--text3);margin-top:2px;letter-spacing:-.1px">'+tb.lbl+'</div>';

}

function trAttachSwipe(){
  var area=document.getElementById('tr-tab-content');
  if(!area) return;
  var order=['aktiv','bekor','brak'];
  var x0=null, y0=null;
  area.addEventListener('touchstart',function(e){ var t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  area.addEventListener('touchend',function(e){
    if(x0===null) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)) return; // gorizontal va yetarli bo'lsa
    var i=order.indexOf(_trModalTab);
    if(dx<0 && i<order.length-1) trSwitchTab(order[i+1]);   // chapga -> keyingi
    else if(dx>0 && i>0) trSwitchTab(order[i-1]);            // o'ngga -> oldingi
  },{passive:true});
}

    var h = '<div style="background:'+opts.bg+';border:1px solid '+opts.bd+';border-radius:var(--r-lg);padding:12px">';
    h += '<div style="display:flex;align-items:center;gap:12px">';
    h += '<div style="width:40px;height:40px;border-radius:var(--r-md);background:'+opts.icBg+';color:'+opts.color+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+ic(opts.icon,19)+'</div>';
    h += '<div style="flex:1;min-width:0">';
    h += '<div style="font-size:12px;color:'+opts.color+';font-weight:700;letter-spacing:-.1px">'+opts.title+'</div>';
    h += '<div style="font-size:11px;color:var(--text3);margin-top:3px;line-height:1.35">'+opts.sub+'</div>';
    h += '</div>';
    h += '<div style="font-size:18px;font-weight:800;letter-spacing:-.4px;flex-shrink:0;font-variant-numeric:tabular-nums;color:'+opts.color+'">'+opts.val+'</div>';
    h += '</div></div>';
    return h;
  }

  // JAMI BALANS (top header)
  html += '<div style="background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:var(--r-lg);padding:18px 16px;text-align:center;margin-bottom:12px;box-shadow:0 4px 14px rgba(59,130,246,.25)">';
  html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.92;display:flex;align-items:center;justify-content:center;gap:6px">'+ic('gem',13,'#fff')+'Umumiy balans</div>';
  html += '<div style="font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums">'+(balansUsd<0?'-':'')+'$'+fmt(Math.abs(Math.round(balansUsd)))+'</div>';
  html += '<div style="font-size:11px;opacity:.8;margin-top:6px">kurs: 1$ = '+fmt(USD_RATE)+' so\'m</div>';
  html += '</div>';

  html += '<div style="display:flex;flex-direction:column;gap:8px">';

  // 1. Ombordagi yuk
  if(omborUsd > 0){
    html += balRow({
      icon:'package', color:'var(--violet)',
      bg:'var(--tint-violet)', bd:'var(--tint-violet-b)', icBg:'var(--tint-violet)',
      title:'Ombordagi yuk',
      sub:(omborSoni>0?fmt(omborSoni)+' dona mahsulot':'jami qiymat'),
      val:'$'+fmt(Math.round(omborUsd))
    });
  }

  // 2. Qarz
  if(qarzFaktSom > 0 || qarzMuddatiSom > 0){
    html += balRow({
      icon:'alert-triangle', color:'var(--red)',
      bg:'var(--tint-red)', bd:'var(--tint-red-b)', icBg:'var(--tint-red)',
      title:'Mijozlardagi qarz',
      sub:fmt(qarzFaktSom)+' so\'m'+(qarzMuddatiSom>0?' · muddati o\'tgan: '+fmt(qarzMuddatiSom):''),
      val:'$'+fmt(Math.round(qarzUsd))
    });
  }

  // 3. Filialda turgan pul (kassa)
  if(turganPulSom > 0){
    html += balRow({
      icon:'banknote', color:'var(--amber)',
      bg:'var(--tint-amber)', bd:'var(--tint-amber-b)', icBg:'var(--tint-amber)',
      title:'Filialda turgan pul',
      sub:turganKun+' kunlik · jo\'natilmagan · '+fmt(turganPulSom)+' so\'m',
      val:'$'+fmt(Math.round(kassaUsd))
    });
  }

  // 4. Transfer — musbat (kelayotgan) yoki manfiy (chiqayotgan)
  if(transferSom !== 0){
    var trPos = transferSom >= 0;
    html += balRow({
      icon: trPos ? 'download' : 'upload',
      color: trPos ? 'var(--blue)' : 'var(--red)',
      bg:   trPos ? 'var(--tint-blue)' : 'var(--tint-red)',
      bd:   trPos ? 'var(--tint-blue-b)' : 'var(--tint-red-b)',
      icBg: trPos ? 'var(--tint-blue)' : 'var(--tint-red)',
      title:'Transfer',
      sub:(trPos ? 'Kelayotgan yuk (yo\'lda)' : 'Chiqib ketadigan yuk (yaratilgan)')+' · '+fmt(Math.abs(transferSom))+' so\'m',
      val:(trPos?'+':'-')+'$'+fmt(Math.abs(Math.round(transferUsd)))
    });
  }

  if(omborUsd<=0 && turganPulSom<=0 && qarzFaktSom<=0 && qarzMuddatiSom<=0 && transferSom===0){
    html += '<div style="text-align:center;color:var(--text3);padding:30px;font-size:13px">Ma\'lumot yo\'q</div>';
  }

  html += '</div>';

  document.getElementById('ombor-modal-title').textContent = f.filial || 'Filial';
  document.getElementById('ombor-modal-body').innerHTML = html;
  document.getElementById('ombor-modal').style.display = 'flex';
}

// ============ TILXAT TIZIMI ============
var _tilxatDebtors = [];
var _tilxatSelected = null;
var _tilxatSearchTimer = null;

function openTilxatPanel(){
  document.getElementById('tilxat-panel').style.display = 'flex';
  document.getElementById('tilxat-search').value = '';
  _tilxatSelected = null;
  document.getElementById('tilxat-upload-box').style.display = 'none';
  loadTilxatDebtors('');
}

function closeTilxatPanel(){
  document.getElementById('tilxat-panel').style.display = 'none';
}

function onTilxatSearchInput(){
  clearTimeout(_tilxatSearchTimer);
  var q = document.getElementById('tilxat-search').value.trim();
  _tilxatSearchTimer = setTimeout(function(){ loadTilxatDebtors(q); }, 350);
}

function loadTilxatDebtors(q){
  var list = document.getElementById('tilxat-debtors-list');
  list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px;font-size:13px">Yuklanmoqda...</div>';
  fetch(TILXAT_DEBTORS + '?uid=' + encodeURIComponent(uid) + '&q=' + encodeURIComponent(q||''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = Array.isArray(d) ? d[0] : d;
      if(!data || data.error){
        list.innerHTML = '<div style="text-align:center;color:var(--red);padding:30px;font-size:13px">Xatolik: '+(data&&data.error||'noma\'lum')+'</div>';
        return;
      }
      _tilxatDebtors = data.debtors || [];
      renderTilxatDebtors();
    })
    .catch(function(){
      list.innerHTML = '<div style="text-align:center;color:var(--red);padding:30px;font-size:13px">Tarmoq xatosi</div>';
    });
}

function renderTilxatDebtors(){
  var list = document.getElementById('tilxat-debtors-list');
  if(!_tilxatDebtors.length){
    list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px;font-size:13px">Mijoz topilmadi</div>';
    return;
  }
  var html = '';
  _tilxatDebtors.forEach(function(m, i){
    var tel = (m.telefon||'').replace(/\D/g,'');
    html += '<div onclick="selectTilxatMijoz('+i+')" role="button" tabindex="0" style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:6px;min-height:56px;cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:center">';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:13px;font-weight:700;letter-spacing:-.1px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(m.ism||'—')+'</div>';
    html += '<div style="font-size:11px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(tel?'+'+tel:'—')+' · '+(m.filial||'')+'</div>';
    html += '</div>';
    html += '<div style="text-align:right;flex-shrink:0">';
    html += '<div style="font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--red);font-variant-numeric:tabular-nums">'+fmt(m.summa)+'</div>';
    html += '<div style="font-size:11px;color:var(--text3);margin-top:2px">so\'m</div>';
    html += '</div>';
    html += '</div>';
  });
  list.innerHTML = html;
}

function selectTilxatMijoz(i){
  _tilxatSelected = _tilxatDebtors[i];
  if(!_tilxatSelected) return;
  var box = document.getElementById('tilxat-upload-box');
  box.style.display = 'block';
  var tel = (_tilxatSelected.telefon||'').replace(/\D/g,'');
  document.getElementById('tilxat-sel-name').textContent = _tilxatSelected.ism || '—';
  document.getElementById('tilxat-sel-info').textContent = (tel?'+'+tel:'') + ' · ' + (_tilxatSelected.filial||'') + ' · Qarz: ' + fmt(_tilxatSelected.summa) + ' so\'m';
  document.getElementById('tilxat-file-input').value = '';
  document.getElementById('tilxat-izoh').value = '';
  document.getElementById('tilxat-upload-status').textContent = '';
  loadTilxatHistory(_tilxatSelected.user_id);
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function loadTilxatHistory(userId){
  var hist = document.getElementById('tilxat-history');
  hist.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:8px 0">Yuklanmoqda...</div>';
  fetch(TILXAT_LIST + '?user_id=' + encodeURIComponent(userId))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = Array.isArray(d) ? d[0] : d;
      var arr = (data && data.tilxatlar) || [];
      if(!arr.length){
        hist.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:8px 0">Hali tilxat yo\'q</div>';
        return;
      }
      var html = '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:12px 0 8px">Avvalgi tilxatlar ('+arr.length+')</div>';
      arr.forEach(function(t){
        var sana = (t.created_at||'').replace('T',' ').substring(0,16);
        html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;margin-bottom:6px;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:10px">';
        html += '<div style="flex:1;min-width:0">';
        html += '<div style="font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px"><span style="display:flex;flex-shrink:0;color:var(--text3)">'+ic('file-text',13)+'</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">'+(t.izoh||t.file_name||'Tilxat')+'</span></div>';
        html += '<div style="font-size:11px;color:var(--text3);margin-top:3px">'+sana+'</div>';
        html += '</div>';
        html += '<a href="'+t.download_link+'" target="_blank" title="Yuklab olish" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--tint-green);border:1px solid var(--tint-green-b);border-radius:var(--r-sm);text-decoration:none;color:var(--green);flex-shrink:0">'+ic('download',15)+'</a>';
        html += '</div>';
      });
      hist.innerHTML = html;
    })
    .catch(function(){
      hist.innerHTML = '<div style="font-size:11px;color:var(--red);padding:8px 0">Tarix yuklanmadi</div>';
    });
}

function submitTilxat(){
  if(!_tilxatSelected){ alert('Mijoz tanlanmagan'); return; }
  var fileInput = document.getElementById('tilxat-file-input');
  if(!fileInput.files || !fileInput.files.length){ alert('Fayl tanlang'); return; }
  var file = fileInput.files[0];
  var maxMB = 15;
  if(file.size > maxMB*1024*1024){ alert('Fayl juda katta (max '+maxMB+'MB)'); return; }
  var izoh = document.getElementById('tilxat-izoh').value.trim();
  var statusEl = document.getElementById('tilxat-upload-status');
  var btn = document.getElementById('tilxat-submit-btn');
  btn.disabled = true;
  statusEl.style.color = 'var(--text3)';
  statusEl.textContent = 'Yuklanmoqda...';

  var fd = new FormData();
  fd.append('file', file, file.name);
  fd.append('file_name', file.name);
  fd.append('user_id', String(_tilxatSelected.user_id||''));
  fd.append('warehouse_id', String(_tilxatSelected.warehouse_id||''));
  fd.append('ism', _tilxatSelected.ism||'');
  fd.append('filial', _tilxatSelected.filial||'');
  fd.append('izoh', izoh);
  fd.append('umumiy_qarz', String(_tilxatSelected.summa||0));
  fd.append('ceo_id', String(uid));

  fetch(TILXAT_UPLOAD, { method:'POST', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = Array.isArray(d) ? d[0] : d;
      // Ikon SVG — textContent emas, innerHTML
      if(data && data.ok){
        statusEl.style.color = 'var(--green)';
        statusEl.innerHTML = ic('check-circle-2',14)+'<span>Tilxat saqlandi</span>';
        fileInput.value = '';
        document.getElementById('tilxat-izoh').value = '';
        loadTilxatHistory(_tilxatSelected.user_id);
      } else {
        statusEl.style.color = 'var(--red)';
        statusEl.innerHTML = ic('x-circle',14)+'<span>Xatolik yuz berdi</span>';
      }
      btn.disabled = false;
    })
    .catch(function(){
      statusEl.style.color = 'var(--red)';
      statusEl.innerHTML = ic('x-circle',14)+'<span>Tarmoq xatosi</span>';
      btn.disabled = false;
    });
}

</script>

<script>
if ('serviceWorker' in navigator) {
  var _swRefreshing = false;
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (_swRefreshing) return;
      _swRefreshing = true;
      window.location.reload();
    });
  }
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('SKIP_WAITING');
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function(){
        if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage('SKIP_WAITING');
      });
    });
  }).catch(function(err){ console.log('SW failed:', err); });
}
</script>
